<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769e0">
  <title>看房记录</title>
  <style>
    :root{--blue:#1769e0;--ink:#1b2942;--muted:#68768e;--line:#e4ebf5;--soft:#f5f8fc;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(860px,calc(100% - 28px));margin:auto;padding:26px 0 48px}.back{display:inline-flex;margin-bottom:16px;color:var(--blue);font-size:14px;text-decoration:none}h1{margin:0;font-size:29px}.intro{margin:6px 0 22px;color:var(--muted);font-size:14px}.card{margin:14px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 6px 20px rgba(25,59,110,.05)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:space-between}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}button,.button{min-height:36px;padding:7px 11px;border:1px solid #bfd3f6;border-radius:8px;color:var(--blue);background:#f4f8ff;font:inherit;font-size:13px;font-weight:650;cursor:pointer;text-decoration:none}.primary{color:#fff;background:var(--blue);border-color:var(--blue)}.danger{color:var(--danger);border-color:#f2c4c0;background:#fff7f6}.filter{min-width:115px;min-height:36px;padding:0 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;font:inherit;font-size:13px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form h2{grid-column:1/-1;margin:2px 0 0;font-size:18px}.form label{display:block;color:#475467;font-size:13px;font-weight:650}.form input,.form select,.form textarea{width:100%;margin-top:6px;padding:9px 10px;border:1px solid #cdd8e8;border-radius:8px;color:var(--ink);background:#fff;font:inherit;font-size:14px}.form input,.form select{height:40px}.form textarea{min-height:82px;resize:vertical}.form .wide{grid-column:1/-1}.unit-preview{display:block;margin-top:6px;color:var(--blue);font-size:12px;font-weight:600}.form-actions{display:flex;gap:9px;grid-column:1/-1}.hidden{display:none}.records{display:grid;gap:12px}.record{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}.record-top{display:flex;gap:12px;justify-content:space-between}.record h2{margin:0;font-size:18px}.record .meta{margin:5px 0;color:var(--muted);font-size:13px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf5ff;color:var(--blue);font-size:12px;font-weight:650;white-space:nowrap}.badge.focus{background:#fff3d8;color:#9a6700}.badge.excluded{background:#fcecec;color:var(--danger)}.record .schools,.record .notes{margin:10px 0 0;padding:10px;border-radius:8px;background:#f7f9fd;color:#4b5b73;font-size:13px}.record .notes{white-space:pre-wrap}.record-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.empty{padding:38px 16px;color:var(--muted);text-align:center}.toast{min-height:20px;margin:6px 0 0;color:#15803d;font-size:13px}@media(max-width:600px){main{width:min(100% - 20px,860px);padding-top:18px}.card{padding:14px}.form{grid-template-columns:1fr}.form h2,.form .wide,.form-actions{grid-column:auto}.toolbar{align-items:stretch}.toolbar-actions{width:100%}.toolbar-actions button{flex:1}.record-top{align-items:flex-start}.record h2{font-size:17px}}
  </style>
  <style>
    .floor-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .floor-row { grid-column: auto; }
    }

    /* Safari's native date control otherwise keeps a wider intrinsic size. */
    .form input[type="date"] {
      min-width: 0;
      min-inline-size: 0;
      max-width: 100%;
    }

    .community-field { position: relative; }
    .community-suggestions {
      position: absolute;
      z-index: 5;
      top: calc(100% - 1px);
      right: 0;
      left: 0;
      overflow: auto;
      max-height: 248px;
      border: 1px solid #cdd8e8;
      border-radius: 0 0 8px 8px;
      background: #fff;
      box-shadow: 0 10px 22px rgba(25, 59, 110, .14);
    }
    .community-suggestions[hidden] { display: none; }
    .community-suggestion {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-bottom: 1px solid #edf1f7;
      border-radius: 0;
      color: var(--ink);
      background: #fff;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
    }
    .community-suggestion:last-child { border-bottom: 0; }
    .community-suggestion:active,
    .community-suggestion:hover { background: #f4f8ff; }
    .auto-school-field input { color: #475467; background: #fff; }
    .record .schools { white-space: pre-line; }
    .loan-preview {
      grid-column: 1 / -1;
      margin: -4px 0 2px;
      padding: 10px;
      border-radius: 8px;
      color: #475467;
      background: #f7f9fd;
      font-size: 13px;
    }
    .loan-preview strong { color: var(--blue); }
    .loan-input-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .loan-input-row label { min-width: 0; }
    .priority-date-field { grid-column: 2; }
    .autosave-status {
      grid-column: 1 / -1;
      margin: -4px 0 2px;
      color: #15803d;
      font-size: 12px;
    }
    .record-extra {
      margin-top: 10px;
      border-radius: 8px;
      background: #f7f9fd;
    }
    .record-extra summary {
      padding: 9px 10px;
      color: var(--blue);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }
    .record-extra .schools,
    .record-extra .notes { margin: 0; }
    .record.is-editing {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .12);
    }
    .record.is-muted { opacity: .48; }
    #records.is-editing-active .record-actions {
      opacity: .42;
      pointer-events: none;
    }
    .record-search {
      min-width: 210px;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 13px;
    }
    .search-empty {
      margin: 14px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    @media (max-width: 600px) {
      .priority-date-field { grid-column: auto; }
    }
  </style>
</head>
<body>
<main>
  <a class="back" data-back href="../entrance/index.html">← 返回上一页</a>
  <h1>看房记录</h1><p class="intro">将房源、看房印象、学区和贷款方案集中保存在当前设备。</p>
  <section class="card toolbar"><select class="filter" id="filter"><option value="all">全部记录</option><option value="focus">重点关注</option><option value="normal">普通</option><option value="excluded">已排除</option></select><div class="toolbar-actions"><button id="export" type="button">导出备份</button><button id="importButton" type="button">导入备份</button><input id="importFile" type="file" accept="application/json" hidden><button class="primary" id="add" type="button">＋ 新增房源</button></div></section>
  <section class="card hidden" id="editor"><form class="form" id="recordForm"><h2 id="editorTitle">新增房源</h2><input id="recordId" name="recordId" type="hidden"><label>小区名称<input id="community" name="community" list="communityHistory" required placeholder="如：诺德假日花园"><datalist id="communityHistory"></datalist></label><label>关注等级<select id="priority" name="priority"><option value="focus">重点关注</option><option value="normal">普通</option><option value="excluded">已排除</option></select></label><label>当前报价（万元）<input id="totalPrice" name="totalPrice" type="number" inputmode="decimal" min="0" placeholder="如：800"></label><label>面积（㎡）<input id="area" name="area" type="number" inputmode="decimal" min="0" placeholder="如：86.15"><span class="unit-preview" id="unitPrice">填写总价和面积后自动计算单价</span></label><label>户型<select id="layout" name="layout"><option value="">请选择</option><option>1室0厅</option><option>1室1厅</option><option>2室1厅</option><option>2室2厅</option><option>3室1厅</option><option>3室2厅</option><option>4室1厅</option><option>4室2厅</option><option>4室3厅</option><option>5室2厅</option><option>5室3厅</option><option>6室及以上</option><option>别墅 / 联排</option><option>其他</option></select></label><label>朝向<input id="orientation" name="orientation" placeholder="如：南 / 东南"></label><label>楼层<select id="floor" name="floor"><option value="">请选择</option></select></label><label>总楼层<input id="totalFloor" name="totalFloor" type="number" inputmode="numeric" min="1" max="200" placeholder="如：32"></label><label>建成年份<select id="builtYear" name="builtYear"><option value="">不详</option></select></label><label>预期成交价（万元）<input id="targetPrice" name="targetPrice" type="number" inputmode="decimal" min="0"></label><label>看房日期<input id="viewedAt" name="viewedAt" type="date"></label><label>房源链接<input id="sourceLink" name="sourceLink" type="url" placeholder="可选"></label><label class="wide">优点<textarea id="pros" name="pros" placeholder="采光、楼层、户型、交通等"></textarea></label><label class="wide">缺点 / 风险<textarea id="cons" name="cons" placeholder="噪音、学位、装修、产权等"></textarea></label><label class="wide">个人备注<textarea id="notes" name="notes" placeholder="记录和家人讨论后的结论"></textarea></label><div class="form-actions"><button class="primary" type="submit">保存记录</button><button id="copyRecord" type="button">复制信息</button><button id="cancel" type="button">取消</button></div></form></section>
  <p class="toast" id="toast" aria-live="polite"></p><section class="records" id="records"></section>
</main>
<script src="../school/official-district-data.js"></script>
<script>
(() => { const $=id=>document.getElementById(id), key='shenzhen-viewing-records-v1'; let records=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const wan=v=>Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:2}); const time=v=>{const d=new Date(Number(v));return Number.isNaN(d.getTime())?'—':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`};
function load(){try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){records=[]}}function save(){localStorage.setItem(key,JSON.stringify(records))}function toast(t){$('toast').textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>{$('toast').textContent=''},2600)}
function unit(r){return r.totalPrice&&r.area?`${wan(r.totalPrice/r.area)} 万/㎡`:''}function priority(v){return v==='focus'?['重点关注','focus']:v==='excluded'?['已排除','excluded']:['普通','normal']}
function renderHistory(){const names=[...new Set(records.map(r=>r.community).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('communityHistory').innerHTML=names.map(name=>`<option value="${esc(name)}"></option>`).join('')}function render(){const choice=$('filter').value;const list=records.filter(r=>choice==='all'||r.priority===choice).sort((a,b)=>(b.createdAt||b.updatedAt||0)-(a.createdAt||a.updatedAt||0));$('records').innerHTML=list.length?list.map(r=>{const [name,kind]=priority(r.priority),floor=r.floor&&r.totalFloor?`${r.floor}/${r.totalFloor}层`:r.floor?`${r.floor}层`:r.totalFloor?`总${r.totalFloor}层`:'' ,detail=[r.area&&`${wan(r.area)}㎡`,r.layout,r.orientation,floor,r.builtYear&&`${r.builtYear}年`,r.totalPrice&&`${wan(r.totalPrice)}万`,unit(r)].filter(Boolean).join(' · ');return `<article class="record"><div class="record-top"><div><h2>${esc(r.community)}</h2><p class="meta">${esc(detail||'暂未填写价格与面积')} ${r.viewedAt?`· 看房：${esc(r.viewedAt)}`:''}</p><p class="meta">最后编辑：${time(r.updatedAt||r.createdAt)}</p></div><span class="badge ${kind}">${name}</span></div><p class="schools">学区：请点击下方“查学区”获取当前官方匹配结果。</p>${r.pros||r.cons||r.notes?`<p class="notes">${r.pros?`优点：${esc(r.pros)}\n`:''}${r.cons?`缺点 / 风险：${esc(r.cons)}\n`:''}${r.notes?`备注：${esc(r.notes)}`:''}</p>`:''}<div class="record-actions"><a class="button" href="../school/index.html?mode=community&q=${encodeURIComponent(r.community)}">查学区</a>${r.sourceLink?`<a class="button" href="${esc(r.sourceLink)}" target="_blank" rel="noreferrer">房源链接 ↗</a>`:''}<a class="button" href="../calculator/index.html?c=${encodeURIComponent(btoa(JSON.stringify({type:'commercial',amountMode:'auto',housePrice:r.totalPrice||'',downPaymentRate:'15'})))}">算月供</a><button data-copy="${r.id}" type="button">复制信息</button><button data-edit="${r.id}" type="button">编辑</button><button class="danger" data-delete="${r.id}" type="button">删除</button></div></article>`}).join(''):'<div class="card empty">还没有看房记录。点击“新增房源”开始记录。</div>';renderHistory();document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copySavedRecord(b.dataset.copy));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete));}
function updateUnit(){const price=+$('totalPrice').value,area=+$('area').value;$('unitPrice').textContent=price&&area?`单价约 ${wan(price/area)} 万/㎡`:'填写总价和面积后自动计算单价'}function openEditor(r={priority:'focus',viewedAt:new Date().toISOString().slice(0,10)}){$('editor').classList.remove('hidden');$('editorTitle').textContent=r.id?'编辑房源':'新增房源';['recordId','community','priority','totalPrice','area','layout','orientation','floor','totalFloor','builtYear','targetPrice','viewedAt','sourceLink','pros','cons','notes'].forEach(id=>$(id).value=r[id]??'');updateUnit();window.scrollTo({top:$('editor').offsetTop-12,behavior:'smooth'})}function edit(id){openEditor(records.find(r=>String(r.id)===id))}function remove(id){if(!confirm('删除这条看房记录？'))return;records=records.filter(r=>String(r.id)!==id);save();render();toast('记录已删除。')}
function download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function recordText(r){const floor=r.floor&&r.totalFloor?`${r.floor}/${r.totalFloor}层`:r.floor?`${r.floor}层`:r.totalFloor?`总${r.totalFloor}层`:'';return [['小区',r.community],['关注等级',priority(r.priority)[0]],['当前报价',r.totalPrice&&`${r.totalPrice} 万元`],['面积',r.area&&`${r.area} ㎡`],['单价',r.totalPrice&&r.area&&`${wan(+r.totalPrice/+r.area)} 万/㎡`],['户型',r.layout],['朝向',r.orientation],['楼层',floor],['建成年份',r.builtYear&&`${r.builtYear} 年`],['预期成交价',r.targetPrice&&`${r.targetPrice} 万元`],['看房日期',r.viewedAt],['房源链接',r.sourceLink],['优点',r.pros],['缺点 / 风险',r.cons],['个人备注',r.notes]].filter(([,value])=>value).map(([label,value])=>`${label}：${value}`).join('\n')}async function copyText(text,message){if(!text){toast('请先填写至少一项信息。');return}try{await navigator.clipboard.writeText(text)}catch(_){const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove()}toast(message)}async function copyRecord(){const values=id=>$(id).value.trim(),data={community:values('community'),priority:$('priority').value,totalPrice:values('totalPrice'),area:values('area'),layout:values('layout'),orientation:values('orientation'),floor:values('floor'),totalFloor:values('totalFloor'),builtYear:values('builtYear'),targetPrice:values('targetPrice'),viewedAt:values('viewedAt'),sourceLink:values('sourceLink'),pros:values('pros'),cons:values('cons'),notes:values('notes')};copyText(recordText(data),'当前编辑信息已复制。')}async function copySavedRecord(id){const record=records.find(r=>String(r.id)===id);if(record)copyText(recordText(record),'当前记录信息已复制。')}function populateBuiltYears(){const select=$('builtYear'),current=new Date().getFullYear();for(let year=current;year>=1950;year--)select.add(new Option(`${year}年`,year))}function populateFloors(){const select=$('floor');for(let floor=1;floor<=40;floor++)select.add(new Option(`${floor}层`,floor))}$('add').onclick=()=>openEditor();$('cancel').onclick=()=>{$('editor').classList.add('hidden')};$('copyRecord').onclick=copyRecord;$('totalPrice').oninput=updateUnit;$('area').oninput=updateUnit;$('filter').onchange=render;$('recordForm').onsubmit=e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target)),now=Date.now();r.id=r.recordId||now.toString();delete r.recordId;const i=records.findIndex(x=>x.id===r.id);r.createdAt=i>=0?(records[i].createdAt||records[i].updatedAt||now):now;r.updatedAt=now;if(i>=0)records[i]=r;else records.push(r);save();$('editor').classList.add('hidden');render();toast('记录已保存。')};$('export').onclick=()=>{download(JSON.stringify(records,null,2),'shenzhen-viewing-records.json');toast('备份文件已导出。')};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error();records=data.filter(x=>x&&x.community);save();render();toast(`已导入 ${records.length} 条记录。`)}catch(_){alert('导入失败：请选择本工具导出的 JSON 文件。')}e.target.value=''};populateBuiltYears();populateFloors();load();render();
})();
</script>
<script>document.querySelector('[data-back]')?.addEventListener('click', event => { if (history.length > 1) { event.preventDefault(); history.back(); } });</script>
<script>
  (() => {
    const orientationLabel = document.getElementById('orientation')?.closest('label');
    if (orientationLabel?.firstChild?.nodeType === Node.TEXT_NODE) {
      orientationLabel.firstChild.nodeValue = '客厅朝向';
    }
    [
      ['pros', '优点（采光、楼层、户型、交通等）'],
      ['cons', '缺点 / 风险（噪音、学位、装修、产权等）'],
      ['notes', '个人备注（记录和家人讨论后的结论）']
    ].forEach(([id, title]) => {
      const input = document.getElementById(id);
      const label = input?.closest('label');
      if (label?.firstChild?.nodeType === Node.TEXT_NODE) label.firstChild.nodeValue = title;
      input?.removeAttribute('placeholder');
    });
    const totalFloorInput = document.getElementById('totalFloor');
    if (totalFloorInput?.tagName === 'INPUT') {
      const totalFloorSelect = document.createElement('select');
      totalFloorSelect.id = 'totalFloor';
      totalFloorSelect.name = 'totalFloor';
      totalFloorSelect.innerHTML = '<option value="">请选择</option>';
      for (let floor = 1; floor <= 40; floor += 1) {
        totalFloorSelect.add(new Option(`${floor}层`, floor));
      }
      totalFloorInput.replaceWith(totalFloorSelect);
    }
    const floorLabel = document.getElementById('floor')?.closest('label');
    const totalFloorLabel = document.getElementById('totalFloor')?.closest('label');
    if (!floorLabel || !totalFloorLabel || floorLabel.parentElement?.classList.contains('floor-row')) return;
    const row = document.createElement('div');
    row.className = 'floor-row';
    floorLabel.before(row);
    row.append(floorLabel, totalFloorLabel);
  })();
</script>
<script>
  (() => {
    const input = document.getElementById('community');
    const field = input?.closest('label');
    if (!input || !field) return;

    field.classList.add('community-field');
    input.removeAttribute('list');
    const panel = document.createElement('div');
    panel.className = 'community-suggestions';
    panel.hidden = true;
    field.append(panel);

    const officialNames = [...new Set(
      (globalThis.NanshanDistrictData?.schools || []).flatMap(school => school.homes || [])
    )].filter(Boolean);
    const normalize = value => String(value).replace(/[\s（）()]/g, '').toLowerCase();
    const names = () => [...new Set([
      ...officialNames,
      ...[...document.querySelectorAll('#communityHistory option')].map(option => option.value)
    ])];
    const hide = () => { panel.hidden = true; panel.replaceChildren(); };
    const show = () => {
      const query = normalize(input.value);
      if (!query) return hide();
      const matches = names()
        .filter(name => normalize(name).includes(query))
        .sort((a, b) => a.length - b.length || a.localeCompare(b, 'zh-CN'))
        .slice(0, 8);
      panel.replaceChildren(...matches.map(name => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'community-suggestion';
        button.textContent = name;
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          input.value = name;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          hide();
          input.focus();
        });
        return button;
      }));
      panel.hidden = matches.length === 0;
    };

    input.addEventListener('input', show);
    input.addEventListener('focus', show);
    input.addEventListener('blur', () => setTimeout(hide, 160));
  })();
</script>
<script>
  (() => {
    const community = document.getElementById('community');
    const form = document.getElementById('recordForm');
    const editor = document.getElementById('editor');
    if (!community || !form || !editor) return;
    const editorAnchor = document.createComment('看房记录编辑器原始位置');
    editor.before(editorAnchor);
    const restoreEditorPosition = () => {
      editorAnchor.after(editor);
      document.querySelectorAll('#records .record').forEach(record => {
        record.classList.remove('is-editing', 'is-muted');
      });
      document.getElementById('records')?.classList.remove('is-editing-active');
    };

    const communityLabel = community.closest('label');
    let previousField = communityLabel;
    const addSchoolField = (id, title) => {
      const label = document.createElement('label');
      label.className = 'auto-school-field';
      label.textContent = title;
      const input = document.createElement('input');
      input.id = id;
      input.name = id;
      input.placeholder = '未匹配';
      label.append(input);
      previousField.after(label);
      previousField = label;
      return input;
    };
    const primaryInput = addSchoolField('primarySchools', '小学（自动匹配，可修改）');
    const middleInput = addSchoolField('middleSchools', '中学（自动匹配，可修改）');
    const normalize = value => String(value || '').replace(/[\s（）()]/g, '').toLowerCase();
    const schools = globalThis.NanshanDistrictData?.schools || [];
    const homes = [...new Set(schools.flatMap(school => school.homes || []).filter(Boolean))];

    const relatedHomes = query => {
      const key = normalize(query);
      if (key.length < 2) return [];
      const related = new Set(homes.filter(home => normalize(home).includes(key)));
      let changed = true;
      while (changed) {
        changed = false;
        for (const home of homes) {
          const homeKey = normalize(home);
          if ([...related].some(item => {
            const itemKey = normalize(item);
            return itemKey.length >= 4 && homeKey.length >= 4
              && (itemKey.includes(homeKey) || homeKey.includes(itemKey));
          }) && !related.has(home)) {
            related.add(home);
            changed = true;
          }
        }
      }
      return [...related];
    };
    const schoolNames = query => {
      const keys = new Set(relatedHomes(query).map(normalize));
      const grouped = { '小学': new Set(), '初中': new Set() };
      schools.forEach(school => {
        if (!grouped[school.level]) return;
        if ((school.homes || []).some(home => keys.has(normalize(home)))) grouped[school.level].add(school.name);
      });
      return {
        primary: [...grouped['小学']],
        middle: [...grouped['初中']]
      };
    };
    const updateSchools = () => {
      const result = schoolNames(community.value);
      primaryInput.value = result.primary.join('、');
      middleInput.value = result.middle.join('、');
      primaryInput.title = primaryInput.value;
      middleInput.title = middleInput.value;
      return result;
    };
    const updateRecordCards = () => {
      document.querySelectorAll('#records .record').forEach(card => {
        const name = card.querySelector('h2')?.textContent;
        const block = card.querySelector('.schools');
        if (!name || !block) return;
        const result = schoolNames(name);
        block.textContent = [
          result.primary.length ? `小学：${result.primary.join('、')}` : '',
          result.middle.length ? `中学：${result.middle.join('、')}` : ''
        ].filter(Boolean).join('\n') || '学区：未匹配官方数据';
      });
    };

    community.addEventListener('input', updateSchools);
    const restoreSavedSchools = () => {
      const id = document.getElementById('recordId')?.value;
      const saved = JSON.parse(localStorage.getItem('shenzhen-viewing-records-v1') || '[]')
        .find(record => String(record.id) === String(id));
      if (!saved) return updateSchools();
      const matched = schoolNames(community.value);
      primaryInput.value = saved.primarySchools || matched.primary.join('、');
      middleInput.value = saved.middleSchools || matched.middle.join('、');
    };
    document.addEventListener('click', event => {
      if (event.target.closest('#add')) {
        setTimeout(() => {
          restoreEditorPosition();
          primaryInput.value = '';
          middleInput.value = '';
        }, 0);
      }
      const editButton = event.target.closest('[data-edit]');
      if (editButton) {
        const record = editButton.closest('.record');
        setTimeout(() => {
          if (record) record.after(editor);
          restoreSavedSchools();
          editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 0);
      }
      if (event.target.closest('#cancel')) setTimeout(restoreEditorPosition, 0);
    });
    form.addEventListener('submit', () => setTimeout(restoreEditorPosition, 0));
    document.addEventListener('pointerdown', event => {
      if (event.target.closest('.community-suggestion')) setTimeout(updateSchools, 0);
    });
    new MutationObserver(updateRecordCards).observe(document.getElementById('records'), { childList: true });
    updateSchools();
    updateRecordCards();
  })();
</script>
<script>
  (() => {
    const form = document.getElementById('recordForm');
    const targetPrice = document.getElementById('targetPrice');
    if (!form || !targetPrice) return;
    const priorityLabel = document.getElementById('priority')?.closest('label');
    const viewedAtLabel = document.getElementById('viewedAt')?.closest('label');
    if (priorityLabel && viewedAtLabel) {
      viewedAtLabel.classList.add('priority-date-field');
      priorityLabel.after(viewedAtLabel);
    }

    let previousField = targetPrice.closest('label');
    const addInputField = (id, title, attributes = {}) => {
      const label = document.createElement('label');
      label.textContent = title;
      const input = document.createElement('input');
      input.id = id;
      input.name = id;
      Object.entries(attributes).forEach(([key, value]) => input.setAttribute(key, value));
      label.append(input);
      previousField.after(label);
      previousField = label;
      return input;
    };
    const downPaymentRate = addInputField('downPaymentRate', '首付比例（%）', {
      type: 'number', inputmode: 'decimal', min: '0', max: '100', step: '0.1', value: '20'
    });
    const commercialRate = addInputField('commercialRate', '商贷年利率（%）', {
      type: 'number', inputmode: 'decimal', min: '0', max: '30', step: '0.01', value: '3.05'
    });
    const loanInputRow = document.createElement('div');
    loanInputRow.className = 'loan-input-row';
    const targetPriceLabel = targetPrice.closest('label');
    targetPriceLabel.before(loanInputRow);
    loanInputRow.append(targetPriceLabel, downPaymentRate.closest('label'), commercialRate.closest('label'));
    previousField = loanInputRow;
    const loanYearsLabel = document.createElement('label');
    loanYearsLabel.textContent = '贷款年限';
    const loanYears = document.createElement('select');
    loanYears.id = 'loanYears';
    loanYears.name = 'loanYears';
    for (let year = 1; year <= 40; year += 1) loanYears.add(new Option(`${year}年`, year));
    loanYears.value = '30';
    loanYearsLabel.append(loanYears);
    loanInputRow.replaceChildren(
      targetPriceLabel,
      loanYearsLabel,
      downPaymentRate.closest('label'),
      commercialRate.closest('label')
    );
    previousField = loanInputRow;

    const preview = document.createElement('p');
    preview.className = 'loan-preview';
    previousField.after(preview);
    const number = value => Number(value || 0);
    const format = value => new Intl.NumberFormat('zh-CN', {
      maximumFractionDigits: 0
    }).format(Math.round(value));
    const calculate = () => {
      const price = number(targetPrice.value) * 10000;
      const downPayment = Math.min(100, Math.max(0, number(downPaymentRate.value)));
      const rate = Math.max(0, number(commercialRate.value)) / 100 / 12;
      const months = Math.max(1, number(loanYears.value) * 12);
      const loan = price * (1 - downPayment / 100);
      if (!price || !loan) {
        preview.textContent = '填写预期成交价后，自动计算等额本金月供。';
        return;
      }
      const monthlyPrincipal = loan / months;
      const firstPayment = monthlyPrincipal + loan * rate;
      const lastPayment = monthlyPrincipal + monthlyPrincipal * rate;
      const equalPayment = rate
        ? loan * rate * (1 + rate) ** months / ((1 + rate) ** months - 1)
        : monthlyPrincipal;
      preview.innerHTML = `预计首付 <strong>${format(price - loan)} 元</strong>；预计贷款 <strong>${format(loan)} 元</strong><br>等额本息：月供 <strong>${format(equalPayment)} 元</strong><br>等额本金：首月月供 <strong>${format(firstPayment)} 元</strong>，末月约 ${format(lastPayment)} 元（逐月递减）`;
    };
    const setPlan = plan => {
      downPaymentRate.value = plan?.downPaymentRate || '20';
      commercialRate.value = plan?.commercialRate || '3.05';
      loanYears.value = plan?.loanYears || '30';
      calculate();
    };
    const currentRecord = () => {
      const id = document.getElementById('recordId')?.value;
      return JSON.parse(localStorage.getItem('shenzhen-viewing-records-v1') || '[]')
        .find(record => String(record.id) === String(id));
    };
    [targetPrice, downPaymentRate, commercialRate].forEach(input => input.addEventListener('input', calculate));
    loanYears.addEventListener('change', calculate);
    document.addEventListener('click', event => {
      if (event.target.closest('#add')) setTimeout(() => setPlan(), 0);
      if (event.target.closest('[data-edit]')) {
        setTimeout(() => setPlan(currentRecord()), 0);
      }
    });
    setPlan();
  })();
</script>
<script>
  (() => {
    const form = document.getElementById('recordForm');
    const editor = document.getElementById('editor');
    const status = document.createElement('p');
    const storageKey = 'shenzhen-viewing-records-v1';
    if (!form || !editor) return;
    status.className = 'autosave-status';
    status.setAttribute('aria-live', 'polite');
    form.querySelector('.form-actions')?.before(status);

    let timer;
    const formatTime = value => new Date(value).toLocaleTimeString('zh-CN', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const saveDraft = () => {
      clearTimeout(timer);
      if (editor.classList.contains('hidden')) return;
      const data = Object.fromEntries(new FormData(form));
      if (!String(data.community || '').trim()) {
        status.textContent = '填写小区名称后自动保存';
        return;
      }
      const now = Date.now();
      try {
        const records = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (!data.recordId) data.recordId = String(now);
        const index = records.findIndex(record => String(record.id) === String(data.recordId));
        const record = { ...data, id: data.recordId, updatedAt: now };
        delete record.recordId;
        record.createdAt = index >= 0
          ? (records[index].createdAt || records[index].updatedAt || now)
          : now;
        if (index >= 0) records[index] = record;
        else records.push(record);
        localStorage.setItem(storageKey, JSON.stringify(records));
        document.getElementById('recordId').value = record.id;
        status.textContent = `已自动保存 · ${formatTime(now)}`;
      } catch (_) {
        status.textContent = '自动保存失败，请使用“保存记录”';
      }
    };
    const scheduleSave = () => {
      if (editor.classList.contains('hidden')) return;
      status.textContent = '正在自动保存…';
      clearTimeout(timer);
      timer = setTimeout(saveDraft, 650);
    };

    form.addEventListener('input', scheduleSave);
    form.addEventListener('change', scheduleSave);
    window.addEventListener('pagehide', saveDraft);
    document.addEventListener('click', event => {
      if (event.target.closest('#add, [data-edit]')) {
        setTimeout(() => { status.textContent = '编辑内容将自动保存'; }, 0);
      }
    });
  })();
</script>
<script>
  (() => {
    const editor = document.getElementById('editor');
    const form = document.getElementById('recordForm');
    if (!editor || !form) return;
    const setValue = (id, value) => {
      const field = document.getElementById(id);
      if (field) field.value = value ?? '';
    };
    document.addEventListener('click', event => {
      const button = event.target.closest('[data-edit]');
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();

      const records = JSON.parse(localStorage.getItem('shenzhen-viewing-records-v1') || '[]');
      const record = records.find(item => String(item.id) === String(button.dataset.edit));
      if (!record) return;
      [
        'recordId', 'community', 'priority', 'totalPrice', 'area', 'layout',
        'orientation', 'floor', 'totalFloor', 'builtYear', 'targetPrice',
        'viewedAt', 'sourceLink', 'pros', 'cons', 'notes',
        'downPaymentRate', 'commercialRate', 'loanYears'
      ].forEach(id => setValue(id, id === 'recordId' ? record.id : record[id]));

      editor.classList.remove('hidden');
      document.getElementById('editorTitle').textContent = '编辑房源';
      document.getElementById('community')?.dispatchEvent(new Event('input', { bubbles: true }));
      if (record.primarySchools) setValue('primarySchools', record.primarySchools);
      if (record.middleSchools) setValue('middleSchools', record.middleSchools);
      document.getElementById('targetPrice')?.dispatchEvent(new Event('input', { bubbles: true }));
      const recordCard = button.closest('.record');
      document.getElementById('records')?.classList.add('is-editing-active');
      document.querySelectorAll('#records .record').forEach(card => {
        card.classList.toggle('is-editing', card === recordCard);
        card.classList.toggle('is-muted', card !== recordCard);
      });
      recordCard?.after(editor);
      editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, true);
  })();
</script>
<script>
  (() => {
    const recordsNode = document.getElementById('records');
    if (!recordsNode) return;
    const format = value => Number(value || 0).toLocaleString('zh-CN', {
      maximumFractionDigits: 2
    });
    const collapse = (card, selector, title) => {
      const content = card.querySelector(selector);
      if (!content || content.closest('details')) return;
      const details = document.createElement('details');
      details.className = 'record-extra';
      const summary = document.createElement('summary');
      summary.textContent = title;
      content.before(details);
      details.append(summary, content);
    };
    const updateCards = () => {
      const records = JSON.parse(localStorage.getItem('shenzhen-viewing-records-v1') || '[]');
      recordsNode.querySelectorAll('.record').forEach(card => {
        const id = card.querySelector('[data-edit]')?.dataset.edit;
        const record = records.find(item => String(item.id) === String(id));
        if (!record) return;
        const floor = record.floor && record.totalFloor
          ? `${record.floor}/${record.totalFloor}层`
          : record.floor ? `${record.floor}层`
          : record.totalFloor ? `总${record.totalFloor}层` : '';
        const unit = record.targetPrice && record.area
          ? `${format(Number(record.targetPrice) / Number(record.area))} 万/㎡`
          : '';
        const detail = [
          record.area && `${format(record.area)}㎡`, record.layout, record.orientation,
          floor, record.builtYear && `${record.builtYear}年`,
          record.targetPrice && `预期 ${format(record.targetPrice)}万`, unit
        ].filter(Boolean).join(' · ');
        const meta = card.querySelector('.record-top .meta');
        if (meta) meta.textContent = `${detail || '暂未填写预期成交价'}${record.viewedAt ? ` · 看房：${record.viewedAt}` : ''}`;
        collapse(card, '.schools', '学校信息');
        collapse(card, '.notes', '优点、缺点与备注');
      });
    };
    new MutationObserver(updateCards).observe(recordsNode, { childList: true });
    updateCards();
  })();
</script>
<script>
  (() => {
    const storageKey = 'shenzhen-viewing-records-v1';
    const toast = document.getElementById('toast');
    const loadRecords = () => {
      try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); }
      catch (_) { return []; }
    };
    const showToast = text => {
      if (!toast) return;
      toast.textContent = text;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.textContent = ''; }, 2200);
    };
    const copy = async text => {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
    };
    const recordText = record => {
      const floor = record.floor && record.totalFloor
        ? `${record.floor}/${record.totalFloor}层`
        : record.floor ? `${record.floor}层`
        : record.totalFloor ? `总${record.totalFloor}层` : '';
      return [
        ['小区', record.community],
        ['关注等级', record.priority === 'focus' ? '重点关注' : record.priority === 'excluded' ? '已排除' : '普通'],
        ['当前报价', record.totalPrice && `${record.totalPrice} 万元`],
        ['预期成交价', record.targetPrice && `${record.targetPrice} 万元`],
        ['面积', record.area && `${record.area} ㎡`],
        ['户型', record.layout],
        ['客厅朝向', record.orientation],
        ['楼层', floor],
        ['建成年份', record.builtYear && `${record.builtYear} 年`],
        ['小学', record.primarySchools],
        ['中学', record.middleSchools],
        ['首付比例', record.downPaymentRate && `${record.downPaymentRate}%`],
        ['商贷年利率', record.commercialRate && `${record.commercialRate}%`],
        ['贷款年限', record.loanYears && `${record.loanYears} 年`],
        ['看房日期', record.viewedAt],
        ['房源链接', record.sourceLink],
        ['优点', record.pros],
        ['缺点 / 风险', record.cons],
        ['个人备注', record.notes]
      ].filter(([, value]) => value).map(([label, value]) => `${label}：${value}`).join('\n');
    };

    document.addEventListener('click', async event => {
      const copyButton = event.target.closest('[data-copy]');
      const deleteButton = event.target.closest('[data-delete]');
      const button = copyButton || deleteButton;
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();

      const id = button.dataset.copy || button.dataset.delete;
      const records = loadRecords();
      const record = records.find(item => String(item.id) === String(id));
      if (!record) {
        showToast('未找到这条记录，请刷新页面后重试。');
        return;
      }
      if (copyButton) {
        await copy(recordText(record));
        showToast('当前记录信息已复制。');
        return;
      }
      if (!confirm(`删除“${record.community}”这条看房记录？`)) return;
      localStorage.setItem(storageKey, JSON.stringify(records.filter(item => String(item.id) !== String(id))));
      showToast('记录已删除。');
      setTimeout(() => location.reload(), 180);
    }, true);
  })();
</script>
<script>
  (() => {
    const toolbar = document.querySelector('.toolbar');
    const recordsNode = document.getElementById('records');
    if (!toolbar || !recordsNode) return;
    const input = document.createElement('input');
    input.id = 'recordSearch';
    input.className = 'record-search';
    input.type = 'search';
    input.placeholder = '搜索小区、学校、备注…';
    input.autocomplete = 'off';
    input.setAttribute('list', 'recordSearchSuggestions');
    const suggestions = document.createElement('datalist');
    suggestions.id = 'recordSearchSuggestions';
    input.after(suggestions);
    toolbar.querySelector('.filter')?.after(input);

    const empty = document.createElement('p');
    empty.className = 'search-empty';
    empty.hidden = true;
    empty.textContent = '没有匹配的看房记录。';
    recordsNode.before(empty);
    const loadRecords = () => {
      try { return JSON.parse(localStorage.getItem('shenzhen-viewing-records-v1') || '[]'); }
      catch (_) { return []; }
    };
    const refresh = () => {
      const records = loadRecords();
      const names = [...new Set(records.map(record => String(record.community || '').trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'zh-CN'));
      suggestions.innerHTML = names.map(name => `<option value="${name}"></option>`).join('');
      const query = input.value.trim().toLocaleLowerCase();
      let visible = 0;
      recordsNode.querySelectorAll('.record').forEach(card => {
        const id = card.querySelector('[data-edit]')?.dataset.edit;
        const record = records.find(item => String(item.id) === String(id));
        const match = !query || JSON.stringify(record || {}).toLocaleLowerCase().includes(query);
        card.hidden = !match;
        if (match) visible += 1;
      });
      empty.hidden = !query || visible > 0;
    };
    input.addEventListener('input', refresh);
    new MutationObserver(refresh).observe(recordsNode, { childList: true });
    refresh();
  })();
</script>
