<script>
  window.calculateViewingLoan = ({ targetPrice, downPaymentRate, commercialRate, loanYears }) => {
    const number = value => Number(value || 0);
    const price = number(targetPrice) * 10000;
    const downPayment = Math.min(100, Math.max(0, number(downPaymentRate)));
    const monthlyRate = Math.max(0, number(commercialRate)) / 100 / 12;
    const months = Math.max(1, number(loanYears) * 12);
    const loan = price * (1 - downPayment / 100);
    if (!price || !loan) return null;
    const monthlyPrincipal = loan / months;
    const equalPayment = monthlyRate
      ? loan * monthlyRate * (1 + monthlyRate) ** months / ((1 + monthlyRate) ** months - 1)
      : monthlyPrincipal;
    return {
      price,
      downPaymentAmount: price - loan,
      loan,
      equalPayment,
      firstPrincipalPayment: monthlyPrincipal + loan * monthlyRate,
      lastPrincipalPayment: monthlyPrincipal + monthlyPrincipal * monthlyRate
    };
  };
</script>

  <h1>看房记录</h1><p class="intro"><span>将房源、看房印象、学区和贷款方案集中保存在当前设备。</span><span class="page-version">版本 v2026.09.01.3</span></p>
  <section class="card toolbar"><select class="filter" id="filter"><option value="all">全部记录</option><option value="focus">重点关注</option><option value="normal">普通</option><option value="excluded">已排除</option></select><div class="toolbar-actions"><button id="export" type="button">导出备份</button><button id="importButton" type="button">导入备份</button><input id="importFile" type="file" accept=".zip,application/zip" hidden><button class="primary" id="add" type="button">＋ 新增房源</button></div></section>
  <section class="card hidden" id="editor"><form class="form" id="recordForm"><h2 id="editorTitle">新增房源</h2><input id="recordId" name="recordId" type="hidden"><label>小区名称<input id="community" name="community" list="communityHistory" required placeholder="如：诺德假日花园"><datalist id="communityHistory"></datalist></label><label>关注等级<select id="priority" name="priority"><option value="focus">重点关注</option><option value="normal">普通</option><option value="excluded">已排除</option></select></label><label>当前报价（万元）<input id="totalPrice" name="totalPrice" type="number" inputmode="decimal" min="0" placeholder="如：800"></label><label>面积（㎡）<input id="area" name="area" type="number" inputmode="decimal" min="0" placeholder="如：86.15"><span class="unit-preview" id="unitPrice">填写总价和面积后自动计算单价</span></label><label>户型<select id="layout" name="layout"><option value="">请选择</option><option>1室0厅</option><option>1室1厅</option><option>2室1厅</option><option>2室2厅</option><option>3室1厅</option><option>3室2厅</option><option>4室1厅</option><option>4室2厅</option><option>4室3厅</option><option>5室2厅</option><option>5室3厅</option><option>6室及以上</option><option>别墅 / 联排</option><option>其他</option></select></label><label>朝向<input id="orientation" name="orientation" placeholder="如：南 / 东南"></label><label>楼层<select id="floor" name="floor"><option value="">请选择</option></select></label><label>总楼层<input id="totalFloor" name="totalFloor" type="number" inputmode="numeric" min="1" max="200" placeholder="如：32"></label><label>建成年份<select id="builtYear" name="builtYear"><option value="">不详</option></select></label><label>预期成交价（万元）<input id="targetPrice" name="targetPrice" type="number" inputmode="decimal" min="0"></label><label>看房日期<input id="viewedAt" name="viewedAt" type="date"></label><label>房源链接<input id="sourceLink" name="sourceLink" type="url" placeholder="可选"></label><label class="wide">优点<textarea id="pros" name="pros" placeholder="采光、楼层、户型、交通等"></textarea></label><label class="wide">缺点 / 风险<textarea id="cons" name="cons" placeholder="噪音、学位、装修、产权等"></textarea></label><label class="wide">个人备注<textarea id="notes" name="notes" placeholder="记录和家人讨论后的结论"></textarea></label><div class="form-actions"><button class="primary" type="submit">保存记录</button><button id="copyRecord" type="button">复制信息</button><button id="cancel" type="button">取消</button></div></form></section>

<script>
(async () => { const $=id=>document.getElementById(id), key='shenzhen-viewing-records-v1'; let records=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const wan=v=>Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:2}); const time=v=>{const d=new Date(Number(v));return Number.isNaN(d.getTime())?'—':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`};

function unit(r){return r.totalPrice&&r.area?`${wan(r.totalPrice/r.area)} 万/㎡`:''}function priority(v){return v==='focus'?['重点关注','focus']:v==='excluded'?['已排除','excluded']:['普通','normal']}

<script>
  (() => {
    const input = document.getElementById('community');
    const field = input?.closest('label');
    if (!input || !field) return;

    field.classList.add('community-field');
    input.removeAttribute('list');
    const panel = document.createElement('div');
    panel.className = 'community-suggestions';
    panel.hidden = true;
    field.append(panel);

    const officialNames = [...new Set(
      (globalThis.NanshanDistrictData?.schools || []).flatMap(school => school.homes || [])
    )].filter(Boolean);
    const normalize = value => String(value).replace(/[\s（）()]/g, '').toLowerCase();
    const names = () => [...new Set([
      ...officialNames,
      ...[...document.querySelectorAll('#communityHistory option')].map(option => option.value)
    ])];
    const hide = () => { panel.hidden = true; panel.replaceChildren(); };
    const show = () => {
      const query = normalize(input.value);
      if (!query) return hide();
      const matches = names()
        .filter(name => normalize(name).includes(query))
        .sort((a, b) => a.length - b.length || a.localeCompare(b, 'zh-CN'))
        .slice(0, 8);
      panel.replaceChildren(...matches.map(name => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'community-suggestion';
        button.textContent = name;
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          input.value = name;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          hide();
          input.focus();
        });
        return button;
      }));
      panel.hidden = matches.length === 0;
    };

    input.addEventListener('input', show);
    input.addEventListener('focus', show);
    input.addEventListener('blur', () => setTimeout(hide, 160));
  })();
</script>
<script>
  (() => {
    const community = document.getElementById('community');
    const form = document.getElementById('recordForm');
    const editor = document.getElementById('editor');
    if (!community || !form || !editor) return;
    const editorAnchor = document.createComment('看房记录编辑器原始位置');
    editor.before(editorAnchor);
    const restoreEditorPosition = () => {
      editorAnchor.after(editor);
      document.querySelectorAll('#records .record').forEach(record => {
        record.classList.remove('is-editing', 'is-muted');
      });
      document.getElementById('records')?.classList.remove('is-editing-active');
    };

    const communityLabel = community.closest('label');
    let previousField = communityLabel;
    const addSchoolField = (id, title) => {
      const label = document.createElement('label');
      label.className = 'auto-school-field';
      label.textContent = title;
      const input = document.createElement('input');
      input.id = id;
      input.name = id;
      input.placeholder = '未匹配';
      label.append(input);
      previousField.after(label);
      previousField = label;
      return input;
    };
    const primaryInput = addSchoolField('primarySchools', '小学（自动匹配，可修改）');
    const middleInput = addSchoolField('middleSchools', '中学（自动匹配，可修改）');
    const normalize = value => String(value || '').replace(/[\s（）()]/g, '').toLowerCase();
    const schools = globalThis.NanshanDistrictData?.schools || [];
    const homes = [...new Set(schools.flatMap(school => school.homes || []).filter(Boolean))];

    const relatedHomes = query => {
      const key = normalize(query);
      if (key.length < 2) return [];
      const related = new Set(homes.filter(home => normalize(home).includes(key)));
      let changed = true;
      while (changed) {
        changed = false;
        for (const home of homes) {
          const homeKey = normalize(home);
          if ([...related].some(item => {
            const itemKey = normalize(item);
            return itemKey.length >= 4 && homeKey.length >= 4
              && (itemKey.includes(homeKey) || homeKey.includes(itemKey));
          }) && !related.has(home)) {
            related.add(home);
            changed = true;
          }
        }
      }
      return [...related];
    };
    const schoolNames = query => {
      const keys = new Set(relatedHomes(query).map(normalize));
      const grouped = { '小学': new Set(), '初中': new Set() };
      schools.forEach(school => {
        if (!grouped[school.level]) return;
        if ((school.homes || []).some(home => keys.has(normalize(home)))) grouped[school.level].add(school.name);
      });
      return {
        primary: [...grouped['小学']],
        middle: [...grouped['初中']]
      };
    };
    const updateSchools = () => {
      const result = schoolNames(community.value);
      primaryInput.value = result.primary.join('、');
      middleInput.value = result.middle.join('、');
      primaryInput.title = primaryInput.value;
      middleInput.title = middleInput.value;
      return result;
    };
    const updateRecordCards = () => {
      document.querySelectorAll('#records .record').forEach(card => {
        const name = card.querySelector('h2')?.textContent;
        const block = card.querySelector('.schools');
        if (!name || !block) return;
        const result = schoolNames(name);
        block.textContent = [
          result.primary.length ? `小学：${result.primary.join('、')}` : '',
          result.middle.length ? `中学：${result.middle.join('、')}` : ''
        ].filter(Boolean).join('\n') || '学区：未匹配官方数据';
      });
    };

    community.addEventListener('input', updateSchools);
    const restoreSavedSchools = () => {
      const id = document.getElementById('recordId')?.value;
      const saved = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]')
        .find(record => String(record.id) === String(id));
      if (!saved) return updateSchools();
      const matched = schoolNames(community.value);
      primaryInput.value = saved.primarySchools || matched.primary.join('、');
      middleInput.value = saved.middleSchools || matched.middle.join('、');
    };
    document.addEventListener('click', event => {
      if (event.target.closest('#add')) {
        setTimeout(() => {
          restoreEditorPosition();
          primaryInput.value = '';
          middleInput.value = '';
        }, 0);
      }
      const editButton = event.target.closest('[data-edit]');
      if (editButton) {
        const record = editButton.closest('.record');
        setTimeout(() => {
          if (record) record.after(editor);
          restoreSavedSchools();
          editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 0);
      }
      if (event.target.closest('#cancel')) setTimeout(restoreEditorPosition, 0);
    });
    form.addEventListener('submit', () => setTimeout(restoreEditorPosition, 0));
    document.addEventListener('pointerdown', event => {
      if (event.target.closest('.community-suggestion')) setTimeout(updateSchools, 0);
    });
    new MutationObserver(updateRecordCards).observe(document.getElementById('records'), { childList: true });
    updateSchools();
    updateRecordCards();
  })();
</script>
<script>
  (() => {
    const form = document.getElementById('recordForm');
    const targetPrice = document.getElementById('targetPrice');
    if (!form || !targetPrice) return;
    const priorityLabel = document.getElementById('priority')?.closest('label');
    const viewedAtLabel = document.getElementById('viewedAt')?.closest('label');
    if (priorityLabel && viewedAtLabel) {
      viewedAtLabel.classList.add('priority-date-field');
      priorityLabel.after(viewedAtLabel);
    }

    let previousField = targetPrice.closest('label');
    const addInputField = (id, title, attributes = {}) => {
      const label = document.createElement('label');
      label.textContent = title;
      const input = document.createElement('input');
      input.id = id;
      input.name = id;
      Object.entries(attributes).forEach(([key, value]) => input.setAttribute(key, value));
      label.append(input);
      previousField.after(label);
      previousField = label;
      return input;
    };
    const downPaymentRate = addInputField('downPaymentRate', '首付比例（%）', {
      type: 'number', inputmode: 'decimal', min: '0', max: '100', step: '0.1', value: '20'
    });
    const commercialRate = addInputField('commercialRate', '商贷年利率（%）', {
      type: 'number', inputmode: 'decimal', min: '0', max: '30', step: '0.01', value: '3.05'
    });
    const loanInputRow = document.createElement('div');
    loanInputRow.className = 'loan-input-row';
    const targetPriceLabel = targetPrice.closest('label');
    targetPriceLabel.before(loanInputRow);
    loanInputRow.append(targetPriceLabel, downPaymentRate.closest('label'), commercialRate.closest('label'));
    previousField = loanInputRow;
    const loanYearsLabel = document.createElement('label');
    loanYearsLabel.textContent = '贷款年限';
    const loanYears = document.createElement('select');
    loanYears.id = 'loanYears';
    loanYears.name = 'loanYears';
    for (let year = 1; year <= 40; year += 1) loanYears.add(new Option(`${year}年`, year));
    loanYears.value = '30';
    loanYearsLabel.append(loanYears);
    loanInputRow.replaceChildren(
      targetPriceLabel,
      loanYearsLabel,
      downPaymentRate.closest('label'),
      commercialRate.closest('label')
    );
    previousField = loanInputRow;

    const preview = document.createElement('p');
    preview.className = 'loan-preview';
    previousField.after(preview);
    const format = value => new Intl.NumberFormat('zh-CN', {
      maximumFractionDigits: 0
    }).format(Math.round(value));
    const calculate = () => {
      const plan = window.calculateViewingLoan({
        targetPrice: targetPrice.value,
        downPaymentRate: downPaymentRate.value,
        commercialRate: commercialRate.value,
        loanYears: loanYears.value
      });
      if (!plan) {
        preview.textContent = '填写报价后，自动计算月供。';
        return;
      }
      preview.innerHTML = `预计首付 <strong>${format(plan.downPaymentAmount)} 元</strong>；预计贷款 <strong>${format(plan.loan)} 元</strong><br>等额本息：月供 <strong>${format(plan.equalPayment)} 元</strong><br>等额本金：首月月供 <strong>${format(plan.firstPrincipalPayment)} 元</strong>，末月约 ${format(plan.lastPrincipalPayment)} 元（逐月递减）`;
    };
    const setPlan = plan => {
      downPaymentRate.value = plan?.downPaymentRate || '20';
      commercialRate.value = plan?.commercialRate || '3.05';
      loanYears.value = plan?.loanYears || '30';
      calculate();
    };
    const currentRecord = () => {
      const id = document.getElementById('recordId')?.value;
      return JSON.parse(window.NativeStore.viewingRecordsJson() || '[]')
        .find(record => String(record.id) === String(id));
    };
    [targetPrice, downPaymentRate, commercialRate].forEach(input => input.addEventListener('input', calculate));
    loanYears.addEventListener('change', calculate);
    document.addEventListener('click', event => {
      if (event.target.closest('#add')) setTimeout(() => setPlan(), 0);
      if (event.target.closest('[data-edit]')) {
        setTimeout(() => setPlan(currentRecord()), 0);
      }
    });
    setPlan();
  })();
</script>
<script>
  (() => {
    const form = document.getElementById('recordForm');
    const editor = document.getElementById('editor');
    const status = document.createElement('p');
    const storageKey = 'shenzhen-viewing-records-v1';
    if (!form || !editor) return;
    status.className = 'autosave-status';
    status.setAttribute('aria-live', 'polite');
    form.querySelector('.form-actions')?.before(status);

    let timer;
    const formatTime = value => new Date(value).toLocaleTimeString('zh-CN', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const saveDraft = () => {
      clearTimeout(timer);
      if (editor.classList.contains('hidden')) return;
      const data = Object.fromEntries(new FormData(form));
      if (!String(data.community || '').trim()) {
        status.textContent = '填写小区名称后自动保存';
        return;
      }
      const now = Date.now();
      try {
        const records = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]');
        if (!data.recordId) data.recordId = String(now);
        const index = records.findIndex(record => String(record.id) === String(data.recordId));
        const record = { ...data, id: data.recordId, updatedAt: now };
        delete record.recordId;
        record.createdAt = index >= 0
          ? (records[index].createdAt || records[index].updatedAt || now)
          : now;
        if (index >= 0) records[index] = record;
        else records.push(record);
        void window.NativeStore.saveViewingRecords(records);
        document.getElementById('recordId').value = record.id;
        status.textContent = `已自动保存 · ${formatTime(now)}`;
      } catch (_) {
        status.textContent = '自动保存失败，请使用“保存记录”';
      }
    };
    const scheduleSave = () => {
      if (editor.classList.contains('hidden')) return;
      status.textContent = '正在自动保存…';
      clearTimeout(timer);
      timer = setTimeout(saveDraft, 650);
    };

    form.addEventListener('input', scheduleSave);
    form.addEventListener('change', scheduleSave);
    window.addEventListener('pagehide', saveDraft);
    document.addEventListener('click', event => {
      if (event.target.closest('#add, [data-edit]')) {
        setTimeout(() => { status.textContent = '编辑内容将自动保存'; }, 0);
      }
    });
  })();
</script>
<script>
  (() => {
    const editor = document.getElementById('editor');
    const form = document.getElementById('recordForm');
    if (!editor || !form) return;
    const setValue = (id, value) => {
      const field = document.getElementById(id);
      if (field) field.value = value ?? '';
    };
    document.addEventListener('click', event => {
      const button = event.target.closest('[data-edit]');
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();

      const records = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]');
      const record = records.find(item => String(item.id) === String(button.dataset.edit));
      if (!record) return;
      [
        'recordId', 'community', 'priority', 'totalPrice', 'area', 'layout',
        'orientation', 'floor', 'totalFloor', 'builtYear', 'targetPrice',
        'viewedAt', 'building', 'sourceLink', 'pros', 'cons', 'notes',
        'downPaymentRate', 'commercialRate', 'loanYears'
      ].forEach(id => setValue(id, id === 'recordId' ? record.id : record[id]));

      editor.classList.remove('hidden');
      document.getElementById('editorTitle').textContent = '编辑房源';
      document.getElementById('community')?.dispatchEvent(new Event('input', { bubbles: true }));
      const suggestionPanel = document.querySelector('.community-suggestions');
      if (suggestionPanel) {
        suggestionPanel.hidden = true;
        suggestionPanel.replaceChildren();
      }
      if (record.primarySchools) setValue('primarySchools', record.primarySchools);
      if (record.middleSchools) setValue('middleSchools', record.middleSchools);
      document.getElementById('targetPrice')?.dispatchEvent(new Event('input', { bubbles: true }));

<script>

    const copy = async text => {

        const area = document.createElement('textarea');

        area.select();

        area.remove();
      }
    };
    const recordText = record => {

      });
      const currency = value => `${Math.round(value).toLocaleString('zh-CN')} 元`;
      const editedAt = record.updatedAt || record.createdAt;
      return [
        ['小区', record.community],
        ['小学', record.primarySchools],
        ['中学', record.middleSchools],
        ['看房日期', record.viewedAt],
        ['关注等级', record.priority === 'focus' ? '重点关注' : record.priority === 'excluded' ? '已排除' : '普通'],
        ['物业公司', record.propertyCompany],
        ['物业费', record.propertyFee && record.propertyFee + ' 元/㎡·月'],
        ['建成年份', record.builtYear && `${record.builtYear} 年`],
        ['车位情况', record.parkingStatus],
        ['楼栋 / 单元', record.building],
        ['车位费用', record.parkingFee],
        ['总楼层', record.totalFloor && `总${record.totalFloor}层`],
        ['面积', record.area && `${record.area} ㎡`],
        ['户型', record.layout],
        ['客厅朝向', record.orientation],
        ['梯户比', record.elevatorRatio],
        ['报价', record.targetPrice && `${record.targetPrice} 万元`],
        ['贷款年限', record.loanYears && `${record.loanYears} 年`],
        ['首付比例', record.downPaymentRate && `${record.downPaymentRate}%`],
        ['商贷年利率', record.commercialRate && `${record.commercialRate}%`],
        ['等额本息月供', plan && currency(plan.equalPayment)],
        ['等额本金首月月供', plan && currency(plan.firstPrincipalPayment)],
        ['房源链接', record.sourceLink],
        ['优点', record.pros],
        ['缺点 / 风险', record.cons],
        ['附近地标', record.nearbyLandmark],
        ['个人备注', record.notes],
        ['最后编辑', editedAt && new Date(Number(editedAt)).toLocaleString('zh-CN', { hour12: false })]
      ].filter(([, value]) => value).map(([label, value]) => `${label}：${value}`).join('\n');
    };

    document.addEventListener('click', async event => {
      const copyButton = event.target.closest('[data-copy]');
      const deleteButton = event.target.closest('[data-delete]');
      const button = copyButton || deleteButton;
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();

      const id = button.dataset.copy || button.dataset.delete;
      const records = loadRecords();
      const record = records.find(item => String(item.id) === String(id));
      if (!record) {
        showToast('未找到这条记录，请刷新页面后重试。');
        return;
      }
      if (copyButton) {
        await copy(recordText(record));
        showToast('当前记录信息已复制。');
        return;
      }
      if (!confirm(`删除“${record.community}”这条看房记录？`)) return;
      void window.NativeStore.saveViewingRecords(records.filter(item => String(item.id) !== String(id)));
      showToast('记录已删除。');
      setTimeout(() => location.reload(), 180);
    }, true);
  })();

    suggestions.id = 'recordSearchSuggestions';
    input.after(suggestions);
    toolbar.querySelector('.filter')?.after(input);
    const count = document.createElement('span');
    count.className = 'record-count';
    toolbar.querySelector('.filter')?.after(count);

    const empty = document.createElement('p');
    empty.className = 'search-empty';
    empty.hidden = true;
    empty.textContent = '没有匹配的看房记录。';
    recordsNode.before(empty);
    const loadRecords = () => {
      try { return JSON.parse(window.NativeStore.viewingRecordsJson() || '[]'); }
      catch (_) { return []; }
    };
    const refresh = () => {
      const records = loadRecords();
      const names = [...new Set(records.map(record => String(record.community || '').trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'zh-CN'));
      suggestions.innerHTML = names.map(name => `<option value="${name}"></option>`).join('');
      const query = input.value.trim().toLocaleLowerCase();
      const hasStatusFilter = document.getElementById('filter')?.value !== 'all';
      let visible = 0;
      recordsNode.querySelectorAll('.record').forEach(card => {
        const id = card.querySelector('[data-edit]')?.dataset.edit;
        const record = records.find(item => String(item.id) === String(id));
        const match = !query || JSON.stringify(record || {}).toLocaleLowerCase().includes(query);
        card.hidden = !match;
        if (match) visible += 1;

        ? `共 ${visible} 条记录`
        : `当前 ${visible} 条 / 共 ${records.length} 条`;

        select.name = isCustom ? '' : 'elevatorRatio';
        custom.name = isCustom ? 'elevatorRatio' : '';
        custom.hidden = !isCustom;
      };
      select.addEventListener('change', () => setMode(select.value === '其他'));
      label.append(select, custom);
      return label;
    };
    const parkingStatus = createField('车位情况', 'parkingStatus', '如：固定车位 / 无车位');
    const parkingFee = createField('车位费用', 'parkingFee', '如：600 元/月');
    const buildingParkingRow = document.createElement('div');
    buildingParkingRow.className = 'field-pair-row parking-row';
    buildingLabel.classList.remove('building-field');
    buildingParkingRow.append(buildingLabel, parkingFee);
    builtYearRow.replaceChildren(builtYearLabel, parkingStatus);
    builtYearRow.after(buildingParkingRow);

    const elevatorRow = document.createElement('div');
    elevatorRow.className = 'field-pair-row elevator-row';
    elevatorRow.append(createElevatorRatioField());
    layoutRow.after(elevatorRow);

    const landmark = document.createElement('label');
    landmark.className = 'wide';
    landmark.textContent = '附近地标';
    const landmarkInput = document.createElement('textarea');
    landmarkInput.id = 'nearbyLandmark';
    landmarkInput.name = 'nearbyLandmark';
    landmarkInput.placeholder = '如：万象天地步行 8 分钟';
    landmark.append(landmarkInput);
    notesLabel.before(landmark);

    const fields = ['parkingStatus', 'parkingFee', 'nearbyLandmark'];
    const restore = () => {
      const id = document.getElementById('recordId')?.value;
      if (!id) return;
      const record = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]')
        .find(item => String(item.id) === String(id));
      const ratio = record?.elevatorRatio || '';
      const ratioSelect = document.getElementById('elevatorRatio');
      const ratioCustom = document.getElementById('elevatorRatioCustom');
      const isPreset = [...ratioSelect.options].some(option => option.value === ratio);
      ratioSelect.value = isPreset ? ratio : ratio ? '其他' : '';
      ratioSelect.name = ratio && !isPreset ? '' : 'elevatorRatio';
      ratioCustom.name = ratio && !isPreset ? 'elevatorRatio' : '';
      ratioCustom.hidden = !ratio || isPreset;
      ratioCustom.value = ratio && !isPreset ? ratio : '';
      fields.forEach(field => {
        const input = document.getElementById(field);
        const value = record?.[field] || '';
        input.value = value;
      });
    };
    new MutationObserver(() => {
      if (!document.getElementById('editor')?.classList.contains('hidden')) restore();
    }).observe(document.getElementById('editor'), { attributes: true, attributeFilter: ['class'] });
    document.addEventListener('click', event => {
      if (event.target.closest('#add')) {
        setTimeout(() => {
          const ratioSelect = document.getElementById('elevatorRatio');
          const ratioCustom = document.getElementById('elevatorRatioCustom');
          ratioSelect.value = '';
          ratioSelect.name = 'elevatorRatio';
          ratioCustom.value = '';
          ratioCustom.name = '';
          ratioCustom.hidden = true;
          fields.forEach(field => { document.getElementById(field).value = ''; });
        }, 0);
      }
    }, true);
  })();
</script>
<script>

    const form = document.getElementById('recordForm');
    const recordsNode = document.getElementById('records');
    if (!form || !recordsNode) return;
    form.addEventListener('submit', () => {
      const idBeforeSave = document.getElementById('recordId')?.value;
      const community = document.getElementById('community')?.value.trim();
      setTimeout(() => {
        let id = idBeforeSave;
        if (!id) {
          try {
            const records = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]');
            id = records
              .filter(record => record.community === community)
              .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0))[0]?.id;
          } catch (_) {}
        }
        const card = [...recordsNode.querySelectorAll('.record')]
          .find(item => String(item.querySelector('[data-edit]')?.dataset.edit) === String(id));
        card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 0);
    });
  })();
</script>
<script>
  (() => {
    const form = document.getElementById('recordForm');
    const community = document.getElementById('community');
    const recordId = document.getElementById('recordId');
    if (!form || !community || !recordId) return;

    const fieldIds = ['propertyCompany', 'propertyFee', 'builtYear', 'parkingFee'];
    const autoValues = new Map();
    const normalize = value => String(value || '').replace(/[\s（）()]/g, '').toLocaleLowerCase();
    const savedRecords = () => {
      try { return JSON.parse(window.NativeStore.viewingRecordsJson() || '[]'); }
      catch (_) { return []; }
    };
    const clearAutoFill = () => {
      autoValues.clear();
      fieldIds.forEach(id => {
        const field = document.getElementById(id);
        if (field) field.value = '';
      });
    };
    const fillFromRecentCommunity = () => {
      if (recordId.value) return;
      const key = normalize(community.value);
      if (!key) return;
      const latest = savedRecords()
        .filter(record => normalize(record.community) === key)
        .sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0))[0];
      if (!latest) return;

      let filled = false;
      fieldIds.forEach(id => {
        const field = document.getElementById(id);
        const value = latest[id] ?? '';
        if (!field || value === '') return;
        if (!field.value || field.value === autoValues.get(id)) {
          field.value = value;
          autoValues.set(id, value);
          filled = true;
        }
      });
      if (filled) {
        const toast = document.getElementById('toast');
        if (toast) toast.textContent = '已带入同小区最近记录的物业、建成年份和车位费用信息。';
      }
    };

    document.addEventListener('click', event => {
      if (event.target.closest('#add')) clearAutoFill();
    }, true);
    community.addEventListener('input', fillFromRecentCommunity);
    community.addEventListener('change', fillFromRecentCommunity);
    document.addEventListener('pointerdown', event => {
      if (event.target.closest('.community-suggestion')) setTimeout(fillFromRecentCommunity, 0);
    });
  })();
</script>
<script>
  (() => {
    const form = document.getElementById('recordForm');
    const editor = document.getElementById('editor');
    const recordsNode = document.getElementById('records');
    const prosLabel = document.getElementById('pros')?.closest('label');
    if (!form || !editor || !recordsNode || !prosLabel || document.getElementById('imageRefs')) return;

    const databaseName = 'shenzhen-viewing-images-v1';
    const storeName = 'images';
    const openDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.open(databaseName, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(storeName);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    const nativeImages = window.NativeStore.isNative();
    const database = nativeImages ? null : openDatabase();
    const run = async (mode, action) => new Promise(async (resolve, reject) => {
      try {
        const db = await database;
        const transaction = db.transaction(storeName, mode);
        const request = action(transaction.objectStore(storeName));
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      } catch (error) { reject(error); }
    });
    const putImage = (recordId, id, blob) => nativeImages
      ? window.NativeStore.storeViewingImage(recordId, id, blob)
      : run('readwrite', store => store.put(blob, id));
    const getImage = ref => nativeImages
      ? window.NativeStore.getViewingImage(ref, true)
      : run('readonly', store => store.get(ref.id));
    const getFullImage = ref => nativeImages
      ? window.NativeStore.getViewingImage(ref, false)
      : run('readonly', store => store.get(ref.id));
    const deleteImage = ref => nativeImages
      ? window.NativeStore.deleteViewingImage(ref)
      : run('readwrite', store => store.delete(ref.id));
    const parseRefs = value => {
      try {
        const refs = JSON.parse(value || '[]');
        return Array.isArray(refs) ? refs : [];
      } catch (_) { return []; }
    };
    const createId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

    const imageSection = document.createElement('div');
    imageSection.className = 'wide';
    const field = document.createElement('label');
    field.textContent = '房源图片（可多选）';
    const picker = document.createElement('input');
    picker.id = 'imagePicker';
    picker.type = 'file';
    picker.accept = 'image/*';
    picker.multiple = true;
    picker.hidden = true;
    const camera = document.createElement('input');
    camera.id = 'imageCamera';
    camera.type = 'file';
    camera.accept = 'image/*';
    camera.setAttribute('capture', 'environment');
    camera.hidden = true;
    const chooseImages = document.createElement('button');
    chooseImages.type = 'button';
    chooseImages.textContent = '选择图片';
    chooseImages.addEventListener('click', () => picker.click());
    const takePhoto = document.createElement('button');
    takePhoto.type = 'button';
    takePhoto.textContent = '拍照';
    takePhoto.addEventListener('click', () => camera.click());
    const refsInput = document.createElement('input');
    refsInput.id = 'imageRefs';
    refsInput.name = 'imageRefs';
    refsInput.type = 'hidden';
    const preview = document.createElement('div');
    preview.className = 'image-preview';
    const imageActions = document.createElement('div');
    imageActions.className = 'image-actions';
    imageActions.append(chooseImages, takePhoto);
    field.append(picker, camera, refsInput);
    imageSection.append(field, imageActions, preview);
    prosLabel.before(imageSection);

    const lightbox = document.createElement('div');
    lightbox.className = 'image-lightbox';
    lightbox.hidden = true;
    const lightboxImage = document.createElement('img');
    const closeLightbox = document.createElement('button');
    closeLightbox.type = 'button';
    closeLightbox.textContent = '×';
    closeLightbox.setAttribute('aria-label', '关闭大图预览');
    lightbox.append(lightboxImage, closeLightbox);
    document.body.append(lightbox);
    let lightboxUrl = '';
    const hideLightbox = () => {
      lightbox.hidden = true;
      if (lightboxUrl) URL.revokeObjectURL(lightboxUrl);
      lightboxUrl = '';
      lightboxImage.removeAttribute('src');
    };
    const showLightbox = (blob, name) => {
      hideLightbox();
      lightboxUrl = URL.createObjectURL(blob);
      lightboxImage.src = lightboxUrl;
      lightboxImage.alt = name || '房源图片';
      lightbox.hidden = false;
    };
    closeLightbox.addEventListener('click', hideLightbox);
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) hideLightbox();
    });

    let refs = [];
    const sync = () => {
      refsInput.value = JSON.stringify(refs);
      form.dispatchEvent(new Event('input', { bubbles: true }));
    };
    const thumbnail = async (ref, removable, target) => {
      const blob = await getImage(ref);
      if (!blob) return;
      const item = document.createElement('div');
      item.className = 'image-item';
      const image = document.createElement('img');
      const url = URL.createObjectURL(blob);
      image.src = url;
      image.alt = ref.name || '房源图片';
      image.onload = () => URL.revokeObjectURL(url);
      image.addEventListener('click', async () => {
        showLightbox(await getFullImage(ref) || blob, ref.name);
      });
      item.append(image);
      if (removable) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = '删除图片';
        remove.addEventListener('click', async () => {
          refs = refs.filter(item => item.id !== ref.id);
          await deleteImage(ref);
          sync();
          renderEditor();
        });
        item.append(remove);
      }
      target.append(item);
    };
    const renderEditor = async () => {
      preview.replaceChildren();
      for (const ref of refs) await thumbnail(ref, true, preview);
    };
    const setRefs = async value => {
      refs = parseRefs(value);
      refsInput.value = JSON.stringify(refs);
      await renderEditor();
    };
    const addFiles = async input => {
      const files = [...input.files || []].filter(file => file.type.startsWith('image/'));
      let recordId = document.getElementById('recordId')?.value;
      if (nativeImages && !recordId) {
        recordId = createId();
        document.getElementById('recordId').value = recordId;
      }
      for (const file of files) {
        const id = createId();
        const stored = await putImage(recordId, id, file);
        refs.push(nativeImages ? stored : { id, name: file.name, type: file.type, createdAt: Date.now() });
      }
      input.value = '';
      sync();
      await renderEditor();
    };
    picker.addEventListener('change', () => addFiles(picker));
    camera.addEventListener('change', () => addFiles(camera));
    new MutationObserver(() => {
      if (editor.classList.contains('hidden')) return;
      const id = document.getElementById('recordId')?.value;
      const record = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]')
        .find(item => String(item.id) === String(id));
      setRefs(record?.imageRefs);
    }).observe(editor, { attributes: true, attributeFilter: ['class'] });
    document.addEventListener('click', event => {
      if (event.target.closest('#add')) {
        setTimeout(() => { refs = []; refsInput.value = '[]'; preview.replaceChildren(); }, 0);
      }
    }, true);

    const renderRecordImages = async () => {
      const records = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]');
      for (const card of recordsNode.querySelectorAll('.record')) {
        const id = card.querySelector('[data-edit]')?.dataset.edit;
        const record = records.find(item => String(item.id) === String(id));
        const imageRefs = parseRefs(record?.imageRefs);
        let details = card.querySelector('.record-images');
        if (!imageRefs.length) {
          details?.remove();
          continue;
        }
        if (details?.dataset.imageIds === JSON.stringify(imageRefs.map(item => item.id))) continue;
        if (!details) {
          details = document.createElement('details');
          details.className = 'record-extra record-images';
          card.querySelector('.record-actions')?.before(details);
        }
        details.dataset.imageIds = JSON.stringify(imageRefs.map(item => item.id));
        const summary = document.createElement('summary');
        summary.textContent = '房源图片（' + imageRefs.length + ' 张）';
        const list = document.createElement('div');
        list.className = 'image-preview';
        details.replaceChildren(summary, list);
        for (const ref of imageRefs) await thumbnail(ref, false, list);
      }
    };
    new MutationObserver(renderRecordImages).observe(recordsNode, { childList: true });
    renderRecordImages();
  })();
</script>
<script>
  (() => {
    const input = document.getElementById('viewedAt');
    const label = input?.closest('label');
    if (!input || !label || document.querySelector('.date-control')) return;

    const control = document.createElement('div');
    control.className = 'date-control';
    const value = document.createElement('span');
    value.className = 'date-control-value';
    const render = () => {
      if (!input.value) {
        value.textContent = '请选择日期';
        return;
      }
      const [year, month, day] = input.value.split('-');
      value.textContent = `${year}年${Number(month)}月${Number(day)}日`;
    };
    input.before(control);
    control.append(value, input);
    input.addEventListener('input', render);
    input.addEventListener('change', render);
    new MutationObserver(() => setTimeout(render, 0)).observe(document.getElementById('editor'), {
      attributes: true,
      attributeFilter: ['class']
    });
    document.addEventListener('click', event => {
      if (event.target.closest('#add, [data-edit]')) setTimeout(render, 0);
    });
    render();
  })();
</script>
<script>
  (() => {
    const records = document.getElementById('records');
    if (!records) return;
    const updateActions = () => {
      let savedRecords = [];
      try { savedRecords = JSON.parse(window.NativeStore.viewingRecordsJson() || '[]'); }
      catch (_) {}
      records.querySelectorAll('.record-actions').forEach(actions => {
        const view = actions.querySelector('[data-edit]');
        if (!view) return;
        view.textContent = '查看';
        actions.prepend(view);

        const record = savedRecords.find(item => String(item.id) === String(view.dataset.edit));
        const calculator = actions.querySelector('a[href*="../calculator/index.html"]');
        if (!record || !calculator) return;
        const housePrice = record.targetPrice ?? record.totalPrice ?? '';
        const calculatorState = {
          type: 'commercial', amountMode: 'auto', housePrice, downPaymentRate: '15'
        };
        calculator.href = '../calculator/index.html?c=' + encodeURIComponent(btoa(JSON.stringify(calculatorState)));
      });
    };
    new MutationObserver(updateActions).observe(records, { childList: true });
    updateActions();
  })();
</script>
