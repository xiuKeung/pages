<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1769e0"><title>深圳购房清单</title><style>
:root{--blue:#1769e0;--ink:#1b2942;--muted:#68768e;--line:#e4ebf5;--soft:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(760px,calc(100% - 28px));margin:auto;padding:26px 0 48px}.back{display:inline-flex;margin-bottom:16px;color:var(--blue);font-size:14px;text-decoration:none}h1{margin:0;font-size:29px}.intro{margin:6px 0 18px;color:var(--muted);font-size:14px}.card{margin:14px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 6px 20px rgba(25,59,110,.05)}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:650}.bar{height:10px;margin-top:10px;overflow:hidden;border-radius:999px;background:#e7edf6}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#1769e0,#4b94f6);transition:width .2s}.actions{display:flex;gap:8px;justify-content:flex-end}button,a.button{min-height:35px;padding:7px 10px;border:1px solid #bcd2f7;border-radius:8px;color:var(--blue);background:#f4f8ff;font:inherit;font-size:13px;font-weight:650;cursor:pointer;text-decoration:none}.reset{color:#b42318;border-color:#f2c4c0;background:#fff7f6}.stage{padding:0;overflow:hidden}.stage h2{margin:0;padding:15px 17px;border-bottom:1px solid var(--line);font-size:17px}.stage h2 span{margin-left:7px;color:var(--muted);font-size:12px;font-weight:500}.task{padding:14px 17px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task-main{display:flex;align-items:flex-start;gap:11px}.task input{width:19px;height:19px;margin:3px 0 0;accent-color:var(--blue)}.task label{flex:1;cursor:pointer;font-size:15px}.task.done label{text-decoration:line-through;color:var(--muted)}.task p{margin:3px 0 0;color:var(--muted);font-size:12px}.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 0 30px}.task-actions button,.task-actions a{min-height:29px;padding:4px 7px;font-size:12px}.note{width:calc(100% - 30px);min-height:58px;margin:9px 0 0 30px;padding:8px;border:1px solid #d5dfed;border-radius:7px;font:inherit;font-size:13px;resize:vertical}.note[hidden]{display:none}.toast{min-height:20px;margin:4px 0;color:#15803d;font-size:13px}@media(max-width:500px){main{width:min(100% - 20px,760px);padding-top:18px}.card{padding:14px}.stage h2,.task{padding-left:14px;padding-right:14px}.actions{justify-content:stretch}.actions button{flex:1}}
</style></head>
<body><main><a class="back" data-back href="../entrance/index.html">← 返回上一页</a><h1>深圳购房清单</h1><p class="intro">按阶段完成关键事项；进度与备注仅保存在当前设备。</p><section class="card"><div class="progress-head"><span>当前进度</span><strong id="progressText">0 / 0 已完成</strong></div><div class="bar"><i id="progressBar"></i></div></section><div class="actions"><button class="reset" id="reset" type="button">重置清单</button></div><p class="toast" id="toast" aria-live="polite"></p><section id="stages"></section></main><script>
(()=>{const $=id=>document.getElementById(id),key='shenzhen-purchase-checklist-v1';const stages=[['看房前准备',[['budget','确认首付预算与可承受月供','先使用房贷计算器预估现金流。','../calculator/index.html','计算月供'],['credit','核验征信与贷款资格','向银行或贷款经理进行预审。'],['school','核对目标小区官方学区','学区与招生政策应以当年官方信息为准。','../school/index.html','查学区'],['fund','确认公积金余额与可贷额度','公积金额度、首付比例请以审批结果为准。'],['cash','确认首付与税费资金来源','避免将装修、税费、应急资金全部计入首付。']]],['选房与核验',[['viewing','实地看房并记录优缺点','查看采光、噪音、楼层、漏水、公共区域等。','../viewings/index.html','记录看房'],['price','核对报价、成交参考与单价','重点比较同小区、同户型、同楼层条件。'],['title','核验产权、抵押与交易限制','签约前请向专业人士、登记部门或中介核验。'],['schoolLock','确认学位占用与入学风险','尤其关注共享学区、多校选择与学位锁定。','../school/index.html','查学区'],['taxEstimate','估算税费','不要只比较首付与挂牌总价。'],['agentEstimate','估算中介费','确认收费标准、服务范围与付款节点。'],['renovationEstimate','估算装修与持有成本','预留装修、物业、维修与应急资金。']]],['贷款与签约',[['loanPlan','确定商贷 / 公积金 / 组合贷方案','将实际银行报价填入计算器复核。','../calculator/index.html','复核贷款'],['contract','逐项核对买卖合同与补充协议','重点确认付款节点、违约责任与交付条件。'],['funds','确认资金监管和付款路径','付款前核对收款账户及监管要求。'],['identityDocs','整理身份证明材料','按银行和交易流程要求准备。'],['marriageDocs','整理婚姻状况材料','按实际婚姻状况准备相关证明。'],['incomeDocs','整理银行流水与收入材料','按银行要求准备流水、收入或资产证明。']]],['过户与交楼',[['taxPayment','确认应缴税费','以交易中心实际核定金额和通知为准。'],['transfer','确认过户安排','核对预约时间、到场人员和所需材料。'],['certificate','确认领证安排','确认不动产权证领取方式与时间。'],['inspection','验房','检查房屋现状、设施设备与约定交付物。'],['propertyHandover','办理物业交割','核对物业费、停车费、门禁与钥匙清单。'],['utilityHandover','办理水电燃气交割','拍照记录表计数值并完成账户交接。'],['schoolPlan','按招生时间节点准备入学材料','最终资格和材料要求以当年教育部门通知为准。','../school/index.html','查看学区图'],['contractArchive','保存买卖合同与补充协议','建议同时保留电子备份。'],['receiptArchive','保存税费及付款票据','保留资金监管、税费、佣金等凭证。'],['loanArchive','保存贷款与交割资料','保留贷款合同、还款计划、交割单等。']]]];let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){state={}};const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(state))}function toast(t){$('toast').textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>{$('toast').textContent=''},2200)}function progress(){const tasks=stages.flatMap(([,items])=>items),done=tasks.filter(([id])=>state[id]?.done).length;$('progressText').textContent=`${done} / ${tasks.length} 已完成`;$('progressBar').style.width=`${tasks.length?done/tasks.length*100:0}%`}function render(){ $('stages').innerHTML=stages.map(([title,items])=>{const done=items.filter(([id])=>state[id]?.done).length;return `<section class="card stage"><h2>${title}<span>${done} / ${items.length} 已完成</span></h2>${items.map(([id,name,desc,href,link])=>`<article class="task ${state[id]?.done?'done':''}"><div class="task-main"><input id="check-${id}" type="checkbox" data-check="${id}" ${state[id]?.done?'checked':''}><label for="check-${id}">${name}<p>${desc}</p></label></div><div class="task-actions">${href?`<a class="button" href="${href}">${link} →</a>`:''}<button data-note="${id}" type="button">${state[id]?.note?'编辑备注':'添加备注'}</button></div><textarea class="note" data-note-box="${id}" placeholder="写下个人备注…" ${state[id]?.open?'':'hidden'}>${esc(state[id]?.note)}</textarea></article>`).join('')}</section>`}).join('');document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{const id=x.dataset.check;state[id]={...(state[id]||{}),done:x.checked};save();render();progress()});document.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>{const id=x.dataset.note;state[id]={...(state[id]||{}),open:!state[id]?.open};save();render()});document.querySelectorAll('[data-note-box]').forEach(x=>x.oninput=()=>{const id=x.dataset.noteBox;state[id]={...(state[id]||{}),note:x.value,open:true};save();progress()});progress()}$('reset').onclick=()=>{if(!confirm('重置所有勾选和备注？'))return;state={};save();render();toast('清单已重置。')};render()})();
</script><script>document.querySelector('[data-back]')?.addEventListener('click', event => { if (history.length > 1) { event.preventDefault(); history.back(); } });</script><script>
(() => {
  const actions = document.querySelector('.actions');
  const toast = document.getElementById('toast');
  if (!actions || !toast) return;
  const button = document.createElement('button');
  button.type = 'button';
  button.id = 'copyDetails';
  button.textContent = '复制详情';
  actions.prepend(button);
  const showToast = text => {
    toast.textContent = text;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { toast.textContent = ''; }, 2200);
  };
  const details = () => {
    const lines = ['深圳购房清单', `导出时间：${new Date().toLocaleString('zh-CN')}`, ''];
    document.querySelectorAll('#stages .stage').forEach(stage => {
      const title = stage.querySelector('h2')?.childNodes[0]?.textContent.trim() || '';
      lines.push(`【${title}】`);
      stage.querySelectorAll('.task').forEach(task => {
        const checked = task.querySelector('[data-check]')?.checked;
        const label = task.querySelector('label');
        const name = label?.childNodes[0]?.textContent.trim() || '';
        const description = task.querySelector('.task p')?.textContent.trim();
        const note = task.querySelector('[data-note-box]')?.value.trim();
        lines.push(`${checked ? '☑' : '☐'} ${name}`);
        if (description) lines.push(`  说明：${description}`);
        if (note) lines.push(`  备注：${note}`);
      });
      lines.push('');
    });
    return lines.join('\n');
  };
  button.addEventListener('click', async () => {
    const text = details();
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    showToast('清单详情已复制。');
  });
})();
</script></body></html>
