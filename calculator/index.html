<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>房贷计算器</title>
  <style>
    :root { --blue:#1769e0; --ink:#1b2942; --muted:#68768e; --line:#e4ebf5; --card:#fff; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#f5f8fc; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(960px,calc(100% - 32px)); margin:auto; padding:30px 0 52px; }
    .back { display:inline-flex; margin-bottom:18px; color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:0 0 7px; font-size:30px; } .subtitle { margin:0 0 25px; color:var(--muted); font-size:14px; }
    .layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr); gap:20px; align-items:start; }
    .card { padding:22px; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:0 8px 22px rgba(30,65,120,.05); }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:21px; padding:4px; border-radius:11px; background:#f1f5fb; }
    .tabs button { border:0; border-radius:8px; padding:10px 4px; background:transparent; color:var(--muted); font:inherit; font-size:14px; cursor:pointer; }
    .tabs button.active { background:#fff; color:var(--blue); font-weight:700; box-shadow:0 2px 7px #dce5f2; }
    .amount-mode { display:flex; gap:18px; margin:0 0 17px; } .amount-mode button { padding:0; border:0; background:none; color:var(--muted); font:inherit; font-size:14px; cursor:pointer; } .amount-mode button.active { color:var(--blue); font-weight:700; } .amount-mode button.active::after { display:block; height:2px; margin-top:5px; border-radius:2px; background:currentColor; content:""; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:15px; } label { display:block; color:#48566d; font-size:13px; font-weight:650; } input,select { width:100%; height:43px; margin-top:7px; padding:0 11px; border:1px solid #ced9e8; border-radius:9px; color:var(--ink); background:#fff; font:inherit; font-size:15px; outline:none; } input:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #e7f0ff; }
    input[readonly] { color:#52617a; background:#f5f8fc; cursor:not-allowed; }
    .unit { position:relative; } .unit span { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; line-height:1; pointer-events:none; } .unit input{ padding-right:36px; }
    .section-title { margin:23px 0 13px; font-size:15px; } .extra.hidden, .hidden { display:none; } .rate-note,.allocation-note { margin:15px 0 0; color:var(--muted); font-size:12px; line-height:1.55; } .loan-preview { grid-column:1 / -1; padding:11px 12px; border-radius:9px; background:#edf5ff; color:#3f526f; font-size:13px; } .loan-preview strong { color:var(--blue); font-size:16px; }
    .calculate { width:100%; margin-top:23px; padding:13px; border:0; border-radius:10px; color:#fff; background:var(--blue); font:inherit; font-weight:700; cursor:pointer; } .calculate:hover{ background:#0f5dcc; }
    .result-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; } .result-head h2 { margin:0; font-size:18px; } .method { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .monthly { margin:23px 0; padding:18px; border-radius:13px; background:#edf5ff; } .monthly span { color:var(--muted); font-size:13px; } .monthly strong { display:block; margin-top:5px; color:var(--blue); font-size:32px; letter-spacing:-.04em; } .monthly em { font-size:15px; font-style:normal; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:13px; } .stat { padding:13px; border:1px solid var(--line); border-radius:11px; } .stat span { display:block; color:var(--muted); font-size:12px; } .stat strong { display:block; margin-top:6px; font-size:16px; }
    .note { margin:19px 0 0; color:var(--muted); font-size:12px; line-height:1.65; }
    @media(max-width:720px) { main{width:min(100% - 24px,960px);padding-top:20px}.layout{grid-template-columns:1fr}.fields{gap:12px}.card{padding:18px} }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../entrance/index.html">← 返回工具入口</a>
    <h1>房贷计算器</h1>
    <p class="subtitle">按当前输入估算月供、利息和还款总额。</p>
    <div class="layout">
      <section class="card">
        <div class="tabs" role="tablist">
          <button class="active" data-type="commercial">商业贷款</button><button data-type="fund">公积金</button><button data-type="combined">组合贷款</button>
        </div>
        <div class="amount-mode" role="tablist">
          <button class="active" data-amount-mode="auto">按房屋总价计算</button><button data-amount-mode="direct">直接输入贷款金额</button>
        </div>
        <div id="priceFields" class="fields">
          <label>房屋总价<span class="unit"><input id="housePrice" type="number" min="0" value="500"><span>万元</span></span></label>
          <label>首付比例<span class="unit"><input id="downPaymentRate" type="number" min="0" max="100" step="1" value="15"><span>%</span></span></label>
          <div class="loan-preview">预计贷款金额：<strong id="autoLoan">—</strong> 万元</div>
        </div>
        <div class="fields">
          <label>还款方式<select id="method"><option value="equal">等额本息</option><option value="principal">等额本金</option></select></label>
          <label>贷款期限<select id="years"></select></label>
        </div>
        <div id="singleFields" class="fields extra">
          <label><span id="singleLabel">贷款金额</span><span class="unit"><input id="singleAmount" type="number" min="0" value="300"><span>万元</span></span></label>
          <label><span id="singleRateLabel">年利率</span><span class="unit"><input id="singleRate" type="number" min="0" step="0.01" value="3.05"><span>%</span></span></label>
        </div>
        <div id="combinedFields" class="fields extra hidden">
          <label>商业贷款金额<span class="unit"><input id="commercialAmount" type="number" min="0" value="200"><span>万元</span></span></label>
          <label>商业贷款年利率<span class="unit"><input id="commercialRate" type="number" min="0" step="0.01" value="3.05"><span>%</span></span></label>
          <label>公积金贷款金额<span class="unit"><input id="fundAmount" type="number" min="0" value="100"><span>万元</span></span></label>
          <label>公积金贷款年利率<span class="unit"><input id="fundRate" type="number" min="0" step="0.01" value="2.60"><span>%</span></span></label>
        </div>
        <p class="allocation-note hidden" id="allocationNote"></p>
        <p class="rate-note" id="rateNote"></p>
        <button class="calculate" id="calculate">开始计算</button>
      </section>
      <aside class="card">
        <div class="result-head"><div><h2>计算结果</h2><p class="method" id="resultMethod">等额本息 · 30 年</p></div></div>
        <div class="monthly"><span id="monthlyTitle">每月月供</span><strong id="monthly">—</strong></div>
        <div class="stats"><div class="stat"><span>贷款总额</span><strong id="totalLoan">—</strong></div><div class="stat"><span>利息总额</span><strong id="interest">—</strong></div><div class="stat"><span>还款总额</span><strong id="totalPayment">—</strong></div><div class="stat"><span id="periodLabel">还款期数</span><strong id="periods">—</strong></div></div>
        <p class="note">默认按深圳现行利率口径估算：商贷使用最低利率，实际执行利率以银行审批为准；未计入提前还款、利率调整、服务费等因素。</p>
      </aside>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let type = 'commercial', amountMode = 'auto', lastPolicyDownPayment = 15;
    const years = $('years');
    for (let year = 1; year <= 30; year++) years.add(new Option(`${year} 年`, year, false, year === 30));
    const format = n => new Intl.NumberFormat('zh-CN',{maximumFractionDigits:0}).format(Math.max(0,n));
    const loan = (amountWan, rate, months, method) => {
      const principal = Number(amountWan || 0) * 10000, monthlyRate = Number(rate || 0) / 100 / 12;
      if (!principal || !months) return { first:0, interest:0, payment:0 };
      if (method === 'equal') { const payment = monthlyRate ? principal * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1) : principal / months; return { first:payment, payment:payment * months, interest:payment * months - principal }; }
      const first = principal / months + principal * monthlyRate;
      const payment = principal + principal * monthlyRate * (months + 1) / 2;
      return { first, payment, interest:payment - principal };
    };
    function applyPolicyRates() {
      const isSecond = false;
      const fundRate = Number(years.value) <= 5 ? (isSecond ? 2.525 : 2.10) : (isSecond ? 3.075 : 2.60);
      const commercialRate = 3.05;
      if (type === 'combined') {
        $('commercialRate').value = commercialRate.toFixed(2);
        $('fundRate').value = fundRate.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
      } else {
        $('singleRate').value = type === 'fund' ? fundRate.toFixed(3).replace(/0+$/, '').replace(/\.$/, '') : commercialRate.toFixed(2);
      }
      const downPayment = type === 'commercial' ? '商贷首套最低首付 15%' : '公积金及组合贷最低首付 20%';
      $('rateNote').textContent = `默认：${downPayment}；商贷最低 3.05%，公积金 ${fundRate}%${Number(years.value) <= 5 ? '（5 年及以下）' : '（5 年以上）'}。首付比例和利率均可手动修改。`;
    }
    function applyPolicyDownPayment() {
      const policyRate = type === 'commercial' ? 15 : 20;
      if (Number($('downPaymentRate').value) === lastPolicyDownPayment) $('downPaymentRate').value = policyRate;
      lastPolicyDownPayment = policyRate;
    }
    function getAutoLoanAmount() {
      return Math.max(0, Number($('housePrice').value || 0) * (1 - Math.min(100, Math.max(0, Number($('downPaymentRate').value || 0))) / 100));
    }
    function updateLoanDisplay() {
      const autoLoan = getAutoLoanAmount();
      $('autoLoan').textContent = format(autoLoan);
      const isAuto = amountMode === 'auto';
      $('priceFields').classList.toggle('hidden', !isAuto);
      if (type !== 'combined') {
        $('singleAmount').readOnly = isAuto;
        $('singleLabel').textContent = isAuto ? '自动计算贷款金额' : (type === 'fund' ? '公积金贷款金额' : '贷款金额');
        if (isAuto) $('singleAmount').value = autoLoan;
      }
      const allocationNote = $('allocationNote');
      const showAllocation = isAuto && type === 'combined';
      allocationNote.classList.toggle('hidden', !showAllocation);
      if (showAllocation) {
        const allocation = Number($('commercialAmount').value || 0) + Number($('fundAmount').value || 0);
        allocationNote.textContent = `预计总贷款 ${format(autoLoan)} 万元；请填写商贷与公积金的分配金额（当前合计 ${format(allocation)} 万元）。`;
      }
    }
    function calculate() {
      const method = $('method').value, months = Number(years.value) * 12;
      const parts = type === 'combined' ? [loan($('commercialAmount').value,$('commercialRate').value,months,method),loan($('fundAmount').value,$('fundRate').value,months,method)] : [loan($('singleAmount').value,$('singleRate').value,months,method)];
      const total = parts.reduce((sum,item) => ({first:sum.first + item.first, interest:sum.interest + item.interest, payment:sum.payment + item.payment}), {first:0,interest:0,payment:0});
      const principal = type === 'combined' ? (Number($('commercialAmount').value || 0)+Number($('fundAmount').value || 0))*10000 : Number($('singleAmount').value || 0)*10000;
      $('monthly').innerHTML = `${format(total.first)} <em>元</em>`;
      $('monthlyTitle').textContent = method === 'equal' ? '每月月供' : '首月月供（每月递减）';
      $('resultMethod').textContent = `${method === 'equal' ? '等额本息' : '等额本金'} · ${years.value} 年`;
      $('totalLoan').textContent = `${format(principal / 10000)} 万元`;
      $('interest').textContent = `${format(total.interest / 10000)} 万元`;
      $('totalPayment').textContent = `${format(total.payment / 10000)} 万元`;
      $('periods').textContent = `${months} 期`;
    }
    document.querySelectorAll('.tabs button').forEach(button => button.addEventListener('click', () => {
      type = button.dataset.type; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===button));
      const combined = type === 'combined'; $('singleFields').classList.toggle('hidden',combined); $('combinedFields').classList.toggle('hidden',!combined);
      if (!combined) { const fund = type === 'fund'; $('singleRateLabel').textContent = fund ? '公积金年利率' : '商业贷款年利率'; }
      applyPolicyDownPayment();
      applyPolicyRates();
      updateLoanDisplay();
      calculate();
    }));
    document.querySelectorAll('.amount-mode button').forEach(button => button.addEventListener('click', () => {
      amountMode = button.dataset.amountMode; document.querySelectorAll('.amount-mode button').forEach(b=>b.classList.toggle('active',b===button));
      updateLoanDisplay(); calculate();
    }));
    $('calculate').addEventListener('click',calculate);
    document.querySelectorAll('input').forEach(node=>node.addEventListener('input',() => { updateLoanDisplay(); calculate(); }));
    $('method').addEventListener('input',calculate);
    years.addEventListener('input',() => { applyPolicyRates(); calculate(); });
    applyPolicyRates(); updateLoanDisplay(); calculate();
  </script>
</body>
</html>
