<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>机械翼龙：投放突袭</title><link rel="stylesheet" href="./style.css"></head><body>
<main><header><a href="../index.html">‹ 积木档案</a><div class="level-picker"><label for="level-select">选择关卡</label><select id="level-select" aria-label="选择关卡"><option value="0">关卡 01 · 首次拦截</option><option value="1">关卡 02 · 交错巡航</option><option value="2">关卡 03 · 低空投放</option><option value="3">关卡 04 · 回旋警报</option><option value="4">关卡 05 · 边界拦截</option><option value="5">关卡 06 · 终端突袭</option></select><h1>机械翼龙：投放突袭</h1></div></header>
<section class="cabinet"><div class="hud"><div><small>积分</small><b id="score">000000</b></div><div class="wave"><small id="wave-label">当前关卡</small><b id="objective">击退投放编队</b><em id="power-state">强化待机</em></div><div><small>坦克装甲</small><b id="lives" aria-label="4 格装甲"><span class="life is-active"></span><span class="life is-active"></span><span class="life is-active"></span><span class="life is-active"></span></b></div></div><div id="scene" aria-label="机械翼龙投放突袭游戏画面"></div><div class="controls"><button data-move="-1" aria-label="向左移动">‹</button><button data-move="1" aria-label="向右移动">›</button></div><div class="overlay" id="overlay"><p class="eyebrow">首批关卡包 / 6 关</p><h2>合体巡航队正在接近</h2><p>击败敌人会掉落强化模块。接住后可短时获得双炮、散射、护盾或减速时间。</p><button id="start">开始</button><small>键盘：A / D 或 ← / → 移动</small></div></section>
