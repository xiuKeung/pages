<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>积木翼龙：小蜜蜂</title><link rel="stylesheet" href="./style.css"></head><body>
<main><header><a href="../index.html">‹ 积木档案</a><div><p>街机试玩关卡 · 01</p><h1>积木翼龙：小蜜蜂</h1></div><button id="restart" aria-label="重新开始">↺</button></header>
<section class="cabinet"><div class="hud"><div><small>积分</small><b id="score">000000</b></div><div class="wave"><small id="wave-label">试玩关卡</small><b id="objective">清除翼龙编队</b></div><div><small>战车装甲</small><b id="lives">● ● ●</b></div></div><div id="scene" aria-label="积木翼龙小蜜蜂游戏画面"></div><div class="hint" id="message">左右移动战车，自动发射能量弹。</div><div class="controls"><button data-move="-1" aria-label="向左移动">‹</button><button id="fire" aria-label="持续射击">发射</button><button data-move="1" aria-label="向右移动">›</button></div><div class="overlay" id="overlay"><p class="eyebrow">试玩关卡 / 约 90 秒</p><h2>翼龙编队正在接近</h2><p>战车会自动发射。左右移动躲开翼龙俯冲与坦克炮火，清除三波翼龙后击败坦克。</p><button id="start">开始试玩</button><small>键盘：A / D 或 ← / → 移动 · 空格发射</small></div></section>
