<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155eef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="深圳学区">
  <title>南山、福田学区查询</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
  <main class="page">
    <header class="hero">
      <a class="hero-back" data-back href="../entrance/index.html">← 返回上一页</a>
      <h1>深圳南山、福田学区信息</h1>
      <p>输入小区或学校，查询官方学区信息。</p>
    </header>

    <section class="search-card" aria-label="学区查询">
      <div class="search-modes" role="tablist" aria-label="查询方式">
        <button id="mode-community" class="is-active" type="button" role="tab" aria-selected="true">小区查学校</button>
        <button id="mode-school" type="button" role="tab" aria-selected="false">学校查小区</button>
      </div>
      <label id="query-label" for="community">小区名称</label>
      <div class="search-row">
        <input id="community" type="search" autocomplete="off" placeholder="如：诺德假日花园" enterkeyhint="search">
        <button id="search" type="button">查询</button>
      </div>
      <div class="filters" aria-label="查询筛选">
        <select id="filter-district" aria-label="区域筛选">
          <option value="">全部区域</option>
          <option value="南山">南山</option>
          <option value="福田">福田</option>
        </select>
        <select id="filter-level" aria-label="学段筛选">
          <option value="">小学和初中</option>
          <option value="小学">仅小学</option>
          <option value="初中">仅初中</option>
        </select>
      </div>
      <div id="suggestions" class="suggestions" aria-live="polite"></div>
      <p id="query-hint" class="hint">支持模糊搜索；命中多个官方小区名称时，会合并展示其对应学校。</p>
    </section>

    <section class="saved-queries" aria-label="查询记录和收藏">
      <div class="saved-head">
        <div class="saved-tabs" role="tablist" aria-label="本地查询记录">
          <button class="is-active" id="saved-recent" type="button" role="tab" aria-selected="true">最近查询</button>
          <button id="saved-favorite" type="button" role="tab" aria-selected="false">收藏</button>
        </div>
        <button id="clear-saved" class="clear-saved" type="button">清空</button>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </section>

    <section id="result" class="result" aria-live="polite">
      <div class="empty">
        <span class="empty-icon">⌕</span>
        <p>输入小区名称开始查询</p>
      </div>
    </section>

    <section class="notice">
      <h2>重要说明</h2>
      <p>结果仅供参考。<br>最终入学资格、共享学区、多校选择与学位锁定，请以当年教育局招生政策及官方学区图为准。</p>
    </section>

    <section class="official-links data-version">
      <h2>数据版本</h2>
      <p id="data-summary">正在读取官方数据快照…</p>
      <p id="snapshot-time">更新时间加载中</p>
      <p id="data-stale" hidden></p>
      <p>数据来源见下方四张官方学区图。</p>
      <button id="install-app" class="install-app" type="button" hidden>添加到主屏幕</button>
    </section>

    <section class="official-links">
      <h2>官方学区图</h2>
      <a href="https://nszs.szns.gov.cn/visitnsgbxyxqdt" target="_blank" rel="noreferrer">南山小学学区图 <span>↗</span></a>
      <a href="https://nszs.szns.gov.cn/visitnsgbcyxqdt" target="_blank" rel="noreferrer">南山初中学区图 <span>↗</span></a>
      <a href="https://zs.szft.gov.cn/visitftgbxyxqdt" target="_blank" rel="noreferrer">福田小学学区图 <span>↗</span></a>
      <a href="https://zs.szft.gov.cn/visitftgbcyxqdt" target="_blank" rel="noreferrer">福田初中学区图 <span>↗</span></a>
    </section>
  </main>
  <script src="official-district-data.js"></script>
  <script src="app.js"></script>
  <script>document.querySelector('[data-back]')?.addEventListener('click', event => { if (history.length > 1) { event.preventDefault(); history.back(); } });</script>
</body>
</html>
